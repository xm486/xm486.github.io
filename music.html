            // 获取歌曲播放URL - 尝试多种格式
            async getSongUrl(songmid) {
                // 根据用户选择的音质确定格式顺序
                const qualityMap = {
                    'm4a':  { prefix: 'C400', ext: '.m4a', name: '标准M4A' },
                    '128':  { prefix: 'M500', ext: '.mp3', name: '128kbps MP3' },
                    '320':  { prefix: 'M800', ext: '.mp3', name: '320kbps MP3' },
                    'flac': { prefix: 'F000', ext: '.flac', name: 'FLAC无损' }
                };
                
                // 回退顺序：选定的音质 -> 320 -> 128 -> m4a -> ogg
                const fallbackOrder = ['320', '128', 'm4a'];
                
                // 把选定音质放最前面
                if (this.currentQuality && !fallbackOrder.includes(this.currentQuality)) {
                    fallbackOrder.unshift(this.currentQuality);
                } else if (this.currentQuality) {
                    fallbackOrder.unshift(this.currentQuality);
                }
                
                // 去重
                const seen = new Set();
                const ordered = fallbackOrder.filter(q => {
                    if (seen.has(q)) return false;
                    seen.add(q);
                    return true;
                });
                
                // 额外加入OGG格式作为最终回退
                const formats = ordered.map(q => qualityMap[q]);
                formats.push({ prefix: 'O400', ext: '.ogg', name: '64kbps OGG' });
                
                // 尝试每种格式
                for (const format of formats) {
                    try {
                        const url = await this.tryGetSongUrl(songmid, format.prefix, format.ext);
                        if (url) {
                            console.log(`成功获取歌曲URL (${format.name}): ${songmid}`);
                            return url;
                        }
                    } catch (error) {
                        console.log(`格式 ${format.name} 尝试失败:`, error.message);
                    }
                }
                
                // 所有格式都失败
                console.log(`所有格式都失败，歌曲: ${songmid}`);
                return null;
            }
            
            // 尝试获取特定格式的歌曲URL
            tryGetSongUrl(songmid, prefix, ext) {
                return new Promise((resolve, reject) => {
                    // 生成安全的回调函数名（只包含字母数字）
                    const callbackName = 'MusicuCb' + Date.now() + Math.floor(Math.random() * 1000);
                    const filename = `${prefix}${songmid}${ext}`;
                    
                    // 设置超时
                    const timeoutId = setTimeout(() => {
                        delete window[callbackName];
                        resolve(null);
                    }, 3000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeoutId);
                        delete window[callbackName];
                        
                        try {
                            // JSONP GET请求返回req_0，POST请求返回req_1
                            const reqData = (data && data.req_1) || (data && data.req_0);
                            if (reqData && reqData.data) {
                                const sip = reqData.data.sip || [];
                                const midurlinfo = reqData.data.midurlinfo;
                                
                                if (midurlinfo && midurlinfo[0]) {
                                    const purl = midurlinfo[0].purl;
                                    if (purl && purl.length > 0) {
                                        // 有有效的purl - 确保使用HTTPS
                                        let fullUrl;
                                        if (sip.length > 0) {
                                            fullUrl = sip[0] + purl;
                                        } else {
                                            fullUrl = 'https://dl.stream.qqmusic.qq.com/' + purl;
                                        }
                                        // 强制转换为HTTPS
                                        fullUrl = fullUrl.replace(/^http:\/\//, 'https://');
                                        
                                        // 验证URL是否可以加载音频数据
                                        const testAudio = new Audio();
                                        testAudio.src = fullUrl;
                                        
                                        // 设置验证超时
                                        const verifyTimeoutId = setTimeout(() => {
                                            testAudio.onerror = null;
                                            testAudio.oncanplaythrough = null;
                                            resolve(null); // 验证超时，返回null
                                        }, 5000);
                                        
                                        testAudio.oncanplaythrough = () => {
                                            // 验证成功
                                            clearTimeout(verifyTimeoutId);
                                            testAudio.onerror = null;
                                            testAudio.oncanplaythrough = null;
                                            console.log(`URL验证成功: ${fullUrl}`);
                                            resolve(fullUrl);
                                        };
                                        
                                        testAudio.onerror = () => {
                                            // 验证失败
                                            clearTimeout(verifyTimeoutId);
                                            testAudio.onerror = null;
                                            testAudio.oncanplaythrough = null;
                                            console.log(`URL验证失败: ${fullUrl}`);
                                            resolve(null);
                                        };
                                        
                                        testAudio.load();
                                    } else {
                                        // purl为空，此格式不可用
                                        resolve(null);
                                    }
                                } else {
                                    resolve(null);
                                }
                            } else {
                                resolve(null);
                            }
                        } catch (error) {
                            reject(error);
                        }
                    };
                    
                    // 构建请求参数
                    const requestData = {
                        req_0: {
                            module: "vkey.GetVkeyServer",
                            method: "CgiGetVkey",
                            param: {
                                guid: this.generateGuid(),
                                songmid: [songmid],
                                songtype: [0],
                                uin: "0",
                                loginflag: 1,
                                platform: "20",
                                filename: [filename]
                            }
                        },
                        loginUin: "0",
                        comm: {
                            uin: "0",
                            format: "json",
                            ct: 24,
                            cv: 0
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = `https://u.y.qq.com/cgi-bin/musicu.fcg?callback=${callbackName}&data=${encodeURIComponent(JSON.stringify(requestData))}`;
                    
                    script.onerror = () => {
                        clearTimeout(timeoutId);
                        delete window[callbackName];
                        resolve(null);
                    };
                    
                    document.head.appendChild(script);
                });
            }
            
            // 加载歌词 - 先尝试API，再回退模拟数据
            async loadLyrics(songName, songmid) {
                this.currentLyricIndex = -1;
                this.currentLyrics = [];
                
                this.elements.lyricsContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                        <span style="font-size: 32px; display: block; margin-bottom: 15px;">⏳</span>
                        <p>加载歌词中...</p>
                    </div>
                `;
                
                // 先尝试从API获取真实歌词
                if (songmid) {
                    try {
                        const apiLyrics = await this.fetchLyricsFromAPI(songmid);
                        if (apiLyrics && apiLyrics.length > 0) {
                            this.currentLyrics = apiLyrics;
                            this.renderLyrics(apiLyrics);
                            return;
                        }
                    } catch (e) {
                        console.log('API歌词获取失败，尝试模拟数据:', e.message);
                    }
                }
                
                // 回退到模拟数据
                const lyrics = mockLyrics[songName] || [];
                
                if (lyrics.length > 0) {
                    this.currentLyrics = lyrics;
                    this.renderLyrics(lyrics);
                } else {
                    this.elements.lyricsContent.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-tertiary);">
                            <span style="font-size: 48px; display: block; margin-bottom: 15px;">📝</span>
                            <p>暂无歌词</p>
                        </div>
                    `;
                }
            }
            
            // 从QQ音乐API获取歌词
            fetchLyricsFromAPI(songmid) {
                return new Promise((resolve, reject) => {
                    const callbackName = 'LyricCb' + Date.now() + Math.floor(Math.random() * 1000);
                    // 使用musicu.fcg统一接口获取歌词
                    const requestData = {
                        comm: { ct: 24, cv: 0 },
                        lyric_0: {
                            module: "music.musichallSong.PlayLyricInfo",
                            method: "GetPlayLyricInfo",
                            param: {
                                songMID: songmid,
                                songID: 0
                            }
                        }
                    };
                    const url = `https://u.y.qq.com/cgi-bin/musicu.fcg?callback=${callbackName}&data=${encodeURIComponent(JSON.stringify(requestData))}`;
                    
                    const timeout = setTimeout(() => {
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        resolve([]); // 超时返回空数组，不reject
                    }, 5000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        
                        try {
                            if (data && data.lyric_0 && data.lyric_0.data) {
                                const lyricData = data.lyric_0.data;
                                const base64 = lyricData.lyric || '';
                                // 正确解码base64为UTF-8
                                const binaryStr = atob(base64);
                                const bytes = new Uint8Array(binaryStr.length);
                                for (let i = 0; i < binaryStr.length; i++) {
                                    bytes[i] = binaryStr.charCodeAt(i);
                                }
                                const lyric = new TextDecoder('utf-8').decode(bytes);
                                resolve(this.parseLRC(lyric));
                            } else {
                                resolve([]);
                            }
                        } catch (e) {
                            console.log('歌词解析失败:', e.message);
                            resolve([]);
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = url;
                    script.onerror = () => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        resolve([]); // 失败返回空数组
                    };
                    document.head.appendChild(script);
                });
            }
            
            // 解析LRC格式歌词
            parseLRC(lrcText) {
                const lines = lrcText.split('\n');
                const result = [];
                
                for (const line of lines) {
                    const matches = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g);
                    if (!matches) continue;
                    
                    for (const match of matches) {
                        const parts = match.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
                        if (parts) {
                            const minutes = parseInt(parts[1]);
                            const seconds = parseInt(parts[2]);
                            const ms = parseInt(parts[3].padEnd(3, '0'));
                            const time = minutes * 60 + seconds + ms / 1000;
                            const text = parts[4].trim();
                            
                            if (text && !text.startsWith('[')) {
                                result.push({ time, text });
                            }
                        }
                    }
                }
                
                return result.sort((a, b) => a.time - b.time);
            }
            
            // 渲染歌词
            renderLyrics(lyrics) {
                let html = '';
                
                lyrics.forEach((line, index) => {
                    html += `
                        <div class="lyric-line" data-time="${line.time}" data-index="${index}">
                            ${this.escapeHtml(line.text)}
                        </div>
                    `;
                });
                
                this.elements.lyricsContent.innerHTML = html;
                
                // 添加歌词行点击事件
                this.elements.lyricsContent.querySelectorAll('.lyric-line').forEach(line => {
                    line.addEventListener('click', () => {
                        const time = parseFloat(line.dataset.time);
                        if (this.audio.duration) {
                            this.audio.currentTime = time;
                        }
                    });
                });
            }
            
            // 切换歌词显示
            toggleLyrics() {
                this.lyricsVisible = !this.lyricsVisible;
                this.elements.lyricsContainer.classList.toggle('active', this.lyricsVisible);
                this.elements.lyricsToggle.textContent = this.lyricsVisible ? '封面' : '词';
            }
            
            // 隐藏歌词
            hideLyrics() {
                this.lyricsVisible = false;
                this.elements.lyricsContainer.classList.remove('active');
                this.elements.lyricsToggle.textContent = '词';
            }
            
            // 更新当前歌词
            updateCurrentLyric() {
                if (!this.lyricsVisible) return;
                
                const currentTime = this.audio.currentTime;
                const lyricLines = this.elements.lyricsContent.querySelectorAll('.lyric-line');
                
                if (lyricLines.length === 0) return;
                
                let newIndex = -1;
                
                // 找到当前时间对应的歌词
                for (let i = lyricLines.length - 1; i >= 0; i--) {
                    const lineTime = parseFloat(lyricLines[i].dataset.time);
                    if (currentTime >= lineTime) {
                        newIndex = i;
                        break;
                    }
                }
                
                // 更新高亮
                if (newIndex !== this.currentLyricIndex) {
                    this.currentLyricIndex = newIndex;
                    
                    lyricLines.forEach((line, index) => {
                        line.classList.toggle('current', index === newIndex);
                        line.classList.toggle('past', index < newIndex);
                    });
                    
                    // 滚动到当前歌词
                    if (newIndex >= 0 && this.elements.lyricsScrollContainer) {
                        const currentLine = lyricLines[newIndex];
                        const container = this.elements.lyricsScrollContainer;
                        const containerHeight = container.clientHeight;
                        const lineTop = currentLine.offsetTop;
                        const lineHeight = currentLine.offsetHeight;
                        const scrollTop = lineTop - (containerHeight / 2) + (lineHeight / 2);
                        
                        container.scrollTo({
                            top: scrollTop,
                            behavior: 'smooth'
                        });
                    }
                }
            }
            
            // 处理导入歌单
            async handleImportPlaylist() {
                const input = this.elements.importInput.value.trim();
                if (!input) {
                    this.showError('请输入歌单链接或ID');
                    return;
                }
                
                // 解析歌单ID
                let disstid = null;
                const idMatch = input.match(/[?&]id=(\d+)/);
                const disstidMatch = input.match(/[?&]disstid=(\d+)/);
                
                if (idMatch) {
                    disstid = idMatch[1];
                } else if (disstidMatch) {
                    disstid = disstidMatch[1];
                } else {
                    const pathMatch = input.match(/playsquare\/(\d+)/);
                    if (pathMatch) {
                        disstid = pathMatch[1];
                    } else {
                        const numMatch = input.match(/\b(\d{7,})\b/);
                        if (numMatch) {
                            disstid = numMatch[1];
                        }
                    }
                }
                
                if (!disstid) {
                    this.showError('无法识别歌单ID，请输入QQ音乐歌单链接或数字ID');
                    return;
                }
                
                // 读取用户输入的歌单名，未填则自动生成
                const userPlaylistName = this.elements.importNameInput.value.trim();
                
                this.showSuccess('正在导入歌单...');
                
                try {
                    const result = await this.fetchPlaylistFromQQ(disstid);
                    
                    if (result && result.songs && result.songs.length > 0) {
                        // 确定歌单名：用户输入 > 接口返回 > 首首歌名 + 等
                        let playlistName = userPlaylistName || result.name;
                        if (!playlistName || playlistName === '导入的歌单') {
                            const firstArtist = result.songs[0].artist;
                            playlistName = firstArtist ? `${firstArtist} 的歌单` : `歌单 ${disstid}`;
                        }
                        
                        const playlistId = 'imported_' + Date.now();
                        this.playlists[playlistId] = {
                            name: playlistName,
                            songs: result.songs,
                            created: Date.now(),
                            imported: true
                        };
                        
                        this.renderPlaylists();
                        this.saveState();
                        this.elements.importInput.value = '';
                        this.elements.importNameInput.value = '';
                        this.showSuccess(`歌单 "${playlistName}" 导入成功，共${result.songs.length}首`);
                    } else {
                        this.showError('未找到歌单歌曲，请检查ID是否正确');
                    }
                } catch (e) {
                    console.error('导入歌单失败:', e);
                    this.showError('导入失败: ' + e.message);
                }
            }
            
            // 获取或设置代理地址
            getProxyUrl() {
                return localStorage.getItem('music_proxy_url') || '';
            }
            
            setProxyUrl(url) {
                localStorage.setItem('music_proxy_url', url.replace(/\/+$/, ''));
                this.showSuccess('代理地址已保存');
            }
            
            // 通过多种方式获取QQ音乐歌单
            async fetchPlaylistFromQQ(disstid) {
                // 策略1: Meting API（无需代理，支持CORS，任何域名可用）
                try {
                    const resp = await fetch(`https://api.injahow.cn/meting/?server=tencent&type=playlist&id=${disstid}`, { signal: AbortSignal.timeout(15000) });
                    if (resp.ok) {
                        const data = await resp.json();
                        if (Array.isArray(data) && data.length > 0) {
                            const songs = data.map(item => {
                                const urlMatch = item.url ? item.url.match(/id=([^&]+)/) : null;
                                const picMatch = item.pic ? item.pic.match(/id=([^&]+)/) : null;
                                const songmid = urlMatch ? urlMatch[1] : '';
                                const albummid = picMatch ? picMatch[1] : '';
                                
                                return {
                                    name: item.name || '未知歌曲',
                                    artist: item.artist || '未知歌手',
                                    album: '',
                                    songmid: songmid,
                                    albummid: albummid,
                                    coverUrl: albummid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${albummid}.jpg` : null,
                                    duration: ''
                                };
                            });
                            return { name: '导入的歌单', songs };
                        }
                    }
                } catch(e) { console.log('Meting API失败:', e.message); }
                
                // 策略2: 自定义代理（备用）
                const proxyUrl = this.getProxyUrl();
                if (proxyUrl) {
                    try {
                        const resp = await fetch(`${proxyUrl}/api/playlist?id=${disstid}`, { signal: AbortSignal.timeout(15000) });
                        if (resp.ok) {
                            const data = await resp.json();
                            const result = this._parsePlaylistData(data);
                            if (result) return result;
                        }
                    } catch(e) { console.log('自定义代理失败:', e.message); }
                }
                
                // 策略3: JSONP直连 (仅在y.qq.com域名下有效)
                try {
                    const result = await this._fetchPlaylistJSONP(disstid);
                    if (result) return result;
                } catch(e) { console.log('JSONP策略失败:', e.message); }
                
                return null;
            }
            
            // JSONP方式获取歌单
            _fetchPlaylistJSONP(disstid) {
                return new Promise((resolve, reject) => {
                    const callbackName = 'PlCb' + Date.now() + Math.floor(Math.random() * 1000);
                    const url = `https://c.y.qq.com/qzone/fcg-bin/fcg_ucc_getcdinfo_byids_cp.fcg?type=1&json=1&utf8=1&onlysong=0&nosign=1&new_format=1&disstid=${disstid}&g_tk=5381&loginUin=0&hostUin=0&format=json&inCharset=GB2312&outCharset=utf-8&notice=0&platform=yqq&needNewCode=0&jsonpCallback=${callbackName}`;
                    
                    const timeout = setTimeout(() => {
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        reject(new Error('请求超时'));
                    }, 10000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        
                        const result = this._parsePlaylistData(data);
                        if (result) {
                            resolve(result);
                        } else {
                            reject(new Error(data.msg || '未找到歌单'));
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = url;
                    script.onerror = () => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        reject(new Error('网络请求失败'));
                    };
                    document.head.appendChild(script);
                });
            }
            
            // 解析歌单数据 (兼容新旧两种格式)
            _parsePlaylistData(data) {
                if (!data) return null;
                
                const cdlist = data.cdlist || (data.data && data.data.cdlist);
                if (!cdlist || cdlist.length === 0) return null;
                
                const cd = cdlist[0];
                const songs = (cd.songlist || []).map(s => {
                    // 兼容 new_format 和旧格式
                    const songmid = s.mid || s.songmid;
                    const albummid = (s.album && s.album.mid) || s.albummid || '';
                    const songname = s.name || s.songname;
                    const albumname = (s.album && s.album.name) || s.albumname || '';
                    const singer = s.singer || [];
                    const interval = s.interval || 0;
                    
                    return {
                        name: songname,
                        artist: singer.map(a => a.name || a.title).join(' / '),
                        album: albumname,
                        songmid: songmid,
                        albummid: albummid,
                        coverUrl: albummid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${albummid}.jpg` : null,
                        duration: interval ? `${Math.floor(interval/60).toString().padStart(2,'0')}:${(interval%60).toString().padStart(2,'0')}` : ''
                    };
                });
                
                if (songs.length === 0) return null;
                
                return {
                    name: cd.dissname || '导入的歌单',
                    songs
                };
            }
            
            // 切换播放/暂停
            togglePlay() {
                if (this.currentSongIndex === -1) return;
                
                if (this.isPlaying) {
                    this.audio.pause();
                } else {
                    this.audio.play();
                }
            }
            
            // 播放上一首
            playPrev() {
                let songs;
                
                if (this.currentPlaylist === 'home') {
                    songs = presetSongs;
                } else if (this.currentPlaylist === 'search') {
                    songs = this.searchResults;
                } else if (this.currentPlaylist.startsWith('playlist:')) {
                    const playlistId = this.currentPlaylist.split(':')[1];
                    songs = this.playlists[playlistId]?.songs || [];
                } else {
                    songs = presetSongs;
                }
                
                if (songs.length === 0) return;
                
                let newIndex = this.currentSongIndex - 1;
                if (newIndex < 0) newIndex = songs.length - 1;
                
                this.playSong(newIndex, this.currentPlaylist);
            }
            
            // 播放下一首
            playNext() {
                let songs;
                
                if (this.currentPlaylist === 'home') {
                    songs = presetSongs;
                } else if (this.currentPlaylist === 'search') {
                    songs = this.searchResults;
                } else if (this.currentPlaylist.startsWith('playlist:')) {
                    const playlistId = this.currentPlaylist.split(':')[1];
                    songs = this.playlists[playlistId]?.songs || [];
                } else {
                    songs = presetSongs;
                }
                
                if (songs.length === 0) return;
                
                let newIndex = this.currentSongIndex + 1;
                if (newIndex >= songs.length) newIndex = 0;
                
                this.playSong(newIndex, this.currentPlaylist);
            }
            
            // 更新播放器UI
            updatePlayerUI(song) {
                this.elements.miniTitle.textContent = song.name;
                this.elements.miniArtist.textContent = song.artist;
                this.elements.fullTitle.textContent = song.name;
                this.elements.fullArtist.textContent = song.artist;
                
                // 更新封面图片
                this.updateCoverImage(song.coverUrl);
            }
            
            // 更新封面图片
            updateCoverImage(coverUrl) {
                // 更新迷你播放器封面
                if (coverUrl) {
                    this.elements.miniCover.innerHTML = `<img src="${coverUrl}" alt="封面" onerror="this.style.display='none';">`;
                } else {
                    this.elements.miniCover.innerHTML = '<span>🎵</span>';
                }
                
                // 更新全屏播放器封面
                if (coverUrl) {
                    this.elements.fullCover.innerHTML = `<img src="${coverUrl}" alt="封面" onerror="this.style.display='none';">`;
                } else {
                    this.elements.fullCover.innerHTML = '<span>🎵</span>';
                }
            }
            
            // 更新播放按钮状态
            updatePlayButton() {
                const icon = this.isPlaying ? '⏸' : '▶';
                this.elements.playBtn.textContent = icon;
                this.elements.fullPlayBtn.textContent = icon;
            }
            
            // 高亮当前播放歌曲
            highlightCurrentSong() {
                const songItems = document.querySelectorAll('.song-item');
                songItems.forEach((item) => {
                    item.classList.remove('active');
                });
                
                // 根据当前播放列表和索引高亮
                const currentItems = document.querySelectorAll(`.song-item[data-source="${this.currentPlaylist}"]`);
                if (currentItems[this.currentSongIndex]) {
                    currentItems[this.currentSongIndex].classList.add('active');
                    
                    // 滚动到当前歌曲
                    currentItems[this.currentSongIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
            
            // 更新进度条
            updateProgress() {
                if (this.isDraggingProgress || !this.audio.duration) return;
                
                const progress = (this.audio.currentTime / this.audio.duration) * 100;
                this.elements.progressCurrent.style.width = `${progress}%`;
                this.elements.progressHandle.style.left = `${progress}%`;
                this.elements.currentTime.textContent = this.formatTime(this.audio.currentTime);
                this.elements.totalTime.textContent = this.formatTime(this.audio.duration);
                
                // 更新歌词
                this.updateCurrentLyric();
            }
            
            // 进度条交互处理
            handleProgressMouseDown(e) {
                this.isDraggingProgress = true;
                this.updateProgressFromEvent(e);
            }
            
            handleProgressTouchStart(e) {
                e.preventDefault();
                this.isDraggingProgress = true;
                this.updateProgressFromEvent(e.touches[0]);
            }
            
            handleProgressMouseMove(e) {
                if (this.isDraggingProgress) {
                    this.updateProgressFromEvent(e);
                }
            }
            
            handleProgressTouchMove(e) {
                if (this.isDraggingProgress) {
                    e.preventDefault();
                    this.updateProgressFromEvent(e.touches[0]);
                }
            }
            
            handleProgressMouseUp() {
                this.isDraggingProgress = false;
            }
            
            handleProgressTouchEnd() {
                this.isDraggingProgress = false;
            }
            
            // 根据事件位置更新进度
            updateProgressFromEvent(e) {
                const progressBar = this.elements.progressBar;
                const rect = progressBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const progress = Math.max(0, Math.min(100, (x / rect.width) * 100));
                
                this.elements.progressCurrent.style.width = `${progress}%`;
                this.elements.progressHandle.style.left = `${progress}%`;
                
                // 更新音频时间
                if (this.audio.duration) {
                    this.audio.currentTime = (progress / 100) * this.audio.duration;
                }
            }
            
            // 音量控制
            handleVolumeChange() {
                const volume = this.elements.volumeSlider.value / 100;
                this.audio.volume = volume;
            }
            
            // 显示全屏播放器
            showFullPlayer() {
                if (this.currentSongIndex === -1) return;
                this.elements.fullPlayer.classList.add('active');
            }
            
            // 隐藏全屏播放器
            hideFullPlayer() {
                this.elements.fullPlayer.classList.remove('active');
            }
            
            // 音频错误处理
            handleAudioError() {
                this.showError('音频播放失败，可能是网络问题或音频格式不支持');
                this.isPlaying = false;
                this.updatePlayButton();
            }
            
            // 显示错误提示
            showError(message) {
                this.elements.errorToast.textContent = message;
                this.elements.errorToast.style.background = 'rgba(255, 0, 110, 0.9)';
                this.elements.errorToast.classList.add('show');
                
                setTimeout(() => {
                    this.elements.errorToast.classList.remove('show');
                }, 3000);
            }
            
            // 显示成功提示
            showSuccess(message) {
                this.elements.errorToast.textContent = message;
                this.elements.errorToast.style.background = 'rgba(0, 245, 212, 0.9)';
                this.elements.errorToast.classList.add('show');
                
                setTimeout(() => {
                    this.elements.errorToast.classList.remove('show');
                }, 3000);
            }
            
            // 显示模态框
            showModal(title, placeholder, callback) {
                this.elements.modalTitle.textContent = title;
                this.elements.modalInput.placeholder = placeholder;
                this.elements.modalInput.value = '';
                this.elements.modalOverlay.classList.add('active');
                
                // 设置确认按钮事件
                this.elements.modalConfirm.onclick = () => {
                    callback(this.elements.modalInput.value);
                };
                
                // 聚焦输入框
                setTimeout(() => {
                    this.elements.modalInput.focus();
                }, 300);
            }
            
            // 隐藏模态框
            hideModal() {
                this.elements.modalOverlay.classList.remove('active');
            }
            
            // 保存播放状态
            saveState() {
                try {
                    const state = {
                        currentSongIndex: this.currentSongIndex,
                        currentPlaylist: this.currentPlaylist,
                        volume: this.audio.volume,
                        playlists: this.playlists,
                        playHistory: this.playHistory
                    };
                    localStorage.setItem('ciyuanMusicState', JSON.stringify(state));
                } catch (error) {
                    console.warn('无法保存播放状态:', error);
                }
            }
            
            // 加载播放状态
            loadState() {
                try {
                    const savedState = localStorage.getItem('ciyuanMusicState');
                    if (savedState) {
                        const state = JSON.parse(savedState);
                        
                        // 恢复歌单
                        if (state.playlists) {
                            this.playlists = state.playlists;
                        }
                        
                        // 恢复播放历史
                        if (state.playHistory) {
                            this.playHistory = state.playHistory;
                        }
                        
                        // 恢复音量
                        if (state.volume !== undefined) {
                            this.audio.volume = state.volume;
                            this.elements.volumeSlider.value = state.volume * 100;
                        }
                    }
                } catch (error) {
                    console.warn('无法加载播放状态:', error);
                }
            }
            
            // 工具函数：格式化时间（秒 -> mm:ss）
            formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            
            // 工具函数：生成GUID
            generateGuid() {
                return 'xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx'.replace(/[x]/g, function() {
                    return (Math.random() * 16 | 0).toString(16);
                });
            }
            
            // 工具函数：HTML转义
            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }
        
        // 初始化播放器
        let musicPlayer;
        document.addEventListener('DOMContentLoaded', () => {
            musicPlayer = new CiyuanMusicPlayer();
            window.musicPlayer = musicPlayer; // 便于调试
        });
    </script>
</body>
</html>
