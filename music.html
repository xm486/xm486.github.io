<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>次元音乐</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基础样式与CSS变量 - 增强二次元赛博星空主题 */
        :root {
            /* 背景色系 - 深邃星空 */
            --bg-primary: #0a0118;
            --bg-secondary: #1a0a2e;
            --bg-tertiary: #0d1b2a;
            --bg-gradient: linear-gradient(135deg, #0a0118 0%, #1a0a2e 40%, #0d1b2a 70%, #0a0e1a 100%);
            
            /* 主题色 - 二次元霓虹 */
            --accent-primary: #ff006e;
            --accent-secondary: #8338ec;
            --accent-tertiary: #3a86ff;
            --accent-neon: #00f5d4;
            --accent-pink: #ff69b4;
            --accent-purple: #b794f6;
            --accent-cyan: #00d9ff;
            
            /* 文字色系 - 高对比度 */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.85);
            --text-tertiary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.45);
            
            /* 玻璃态效果 */
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-hover: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(24px);
            
            /* 阴影系统 */
            --shadow-xs: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.6);
            
            /* 霓虹发光效果 - 更柔和的版本 */
            --neon-glow-pink: 
                0 0 6px rgba(255, 0, 110, 0.4),
                0 0 12px rgba(255, 0, 110, 0.25);
                
            --neon-glow-cyan: 
                0 0 6px rgba(0, 245, 212, 0.4),
                0 0 12px rgba(0, 245, 212, 0.25);
                
            --neon-glow-purple: 
                0 0 6px rgba(131, 56, 236, 0.4),
                0 0 12px rgba(131, 56, 236, 0.25);
                
            --neon-glow-subtle: 
                0 0 8px rgba(255, 255, 255, 0.1);
            
            /* 动画时长 - 符合 Material Design 标准 */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 500ms cubic-bezier(0.34, 1.56, 0.64, 1);
            
            /* 圆角系统 - 8px 基准 */
            --radius-xs: 4px;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
            --radius-full: 9999px;
            
            /* 间距系统 - 8px 网格 */
            --space-1: 4px;
            --space-2: 8px;
            --space-3: 12px;
            --space-4: 16px;
            --space-5: 20px;
            --space-6: 24px;
            --space-8: 32px;
            --space-10: 40px;
            --space-12: 48px;
            
            /* 安全区域 */
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
            
            /* 组件高度 - 符合触控标准 (≥44px) */
            --header-height: 56px;
            --tab-height: 64px;
            --player-bar-height: 80px;
            --touch-target-min: 44px;
            
            /* 字体大小系统 */
            --text-xs: 12px;
            --text-sm: 13px;
            --text-base: 15px;
            --text-lg: 17px;
            --text-xl: 20px;
            --text-2xl: 24px;
            --text-3xl: 30px;
            
            /* 响应式断点 */
            --breakpoint-sm: 375px;
            --breakpoint-md: 768px;
            --breakpoint-lg: 1024px;
            --breakpoint-xl: 1440px;
        }
        
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        }
        
        html {
            height: 100%;
            overflow: hidden;
            font-size: 16px; /* 基准字体大小，避免 iOS 自动缩放 */
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
            position: relative;
            line-height: 1.6; /* 提升可读性 */
        }
        
        /* 应用容器 - 响应式布局 */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 100vw;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }
        
        /* 平板和桌面端容器宽度限制 */
        @media (min-width: 768px) {
            .app {
                max-width: 768px;
                box-shadow: var(--shadow-xl);
            }
        }
        
        @media (min-width: 1024px) {
            .app {
                max-width: 1024px;
            }
        }
        
        /* 星空背景动画 - 性能优化 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 50px 160px, #ddd, transparent),
                radial-gradient(2px 2px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 120px, #ddd, transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite alternate;
            will-change: opacity; /* 性能优化 */
        }
        
        @keyframes twinkle {
            from { opacity: 0.4; }
            to { opacity: 0.8; }
        }
        
        /* 减少动画 - 可访问性 */
        @media (prefers-reduced-motion: reduce) {
            .stars {
                animation: none;
                opacity: 0.6;
            }
            
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        /* 顶部标题栏 - 增强玻璃态和安全区域 */
        .header {
            background: rgba(10, 1, 24, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: calc(var(--safe-top) + var(--space-3)) var(--space-4) var(--space-3);
            flex-shrink: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: var(--header-height);
            box-shadow: var(--shadow-sm);
        }
        
        .app-title {
            font-size: var(--text-xl);
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-cyan), var(--accent-neon));
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.5px;
            animation: gradientShift 3s ease infinite;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .header-search-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: var(--text-xl);
            cursor: pointer;
            padding: var(--space-2);
            border-radius: var(--radius-full);
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: var(--touch-target-min);
            min-height: var(--touch-target-min);
            position: relative;
            overflow: hidden;
        }
        
        .header-search-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--accent-neon) 0%, transparent 70%);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }
        
        .header-search-btn:hover::before,
        .header-search-btn:active::before {
            opacity: 0.2;
        }
        
        .header-search-btn:active {
            transform: scale(0.95);
            background: var(--glass-bg-hover);
        }
        
        /* 焦点状态 - 可访问性 */
        .header-search-btn:focus-visible {
            outline: 2px solid var(--accent-neon);
            outline-offset: 2px;
        }
        
        /* 主内容区域 - 动态计算底部空间 */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-bottom: calc(var(--player-bar-height) + var(--tab-height) + 20px);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
        }
        
        .main-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        /* 页面切换 */
        .page {
            display: none;
            padding: 15px;
            min-height: 100%;
        }
        
        .page.active {
            display: block;
        }
        
        /* 首页样式 */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 15px;
            color: var(--accent-neon);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent-primary);
            border-radius: 2px;
        }
        
        .recommend-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .recommend-card {
            background: var(--glass-bg);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all var(--transition-normal);
            cursor: pointer;
        }
        
        .recommend-card:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }
        
        .card-cover {
            width: 100%;
            padding-bottom: 100%;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-cover img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-play-icon {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(255, 0, 110, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: var(--neon-glow);
        }
        
        .card-info {
            padding: 8px;
        }
        
        .card-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        
        .card-artist {
            font-size: 10px;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 歌曲列表样式 */
        .song-list {
            margin-bottom: var(--space-5);
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: var(--space-3) var(--space-2);
            min-height: var(--touch-target-min);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-normal);
            position: relative;
            overflow: hidden;
            margin-bottom: var(--space-1);
        }
        
        /* 水波纹效果 */
        .song-item::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, var(--accent-primary) 0%, transparent 70%);
            opacity: 0;
            transform: scale(0);
            transition: all 400ms cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            z-index: 0;
        }
        
        .song-item:active::after {
            opacity: 0.2;
            transform: scale(2);
        }
        
        .song-item:hover {
            background: var(--glass-bg);
        }
        
        .song-item:active {
            transform: scale(0.98);
            background: var(--glass-bg-hover);
        }
        
        .song-item.active {
            background: linear-gradient(90deg, rgba(255, 0, 110, 0.15), rgba(131, 56, 236, 0.1));
            border: 1px solid rgba(255, 0, 110, 0.3);
            box-shadow: 0 0 16px rgba(255, 0, 110, 0.2);
        }
        
        .song-index {
            width: 32px;
            color: var(--text-tertiary);
            font-size: var(--text-sm);
            font-weight: 600;
            text-align: center;
            flex-shrink: 0;
            z-index: 1;
        }
        
        .song-item.active .song-index {
            color: var(--accent-primary);
            text-shadow: 0 0 8px var(--accent-primary);
        }
        
        .song-cover {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            margin-right: var(--space-3);
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: var(--text-xl);
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--glass-border);
            z-index: 1;
        }
        
        .song-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .song-info {
            flex: 1;
            min-width: 0;
            z-index: 1;
        }
        
        .song-name {
            font-size: var(--text-base);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        
        .song-item.active .song-name {
            color: var(--accent-primary);
        }
        
        .song-artist {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .song-duration {
            color: var(--text-tertiary);
            font-size: 13px;
            flex-shrink: 0;
            margin-left: 10px;
        }
        /* 添加到歌单按钮 */
        .add-to-playlist-btn,
        .download-song-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--accent-neon);
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: all var(--transition-fast);
            position: relative;
            z-index: 6;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .add-to-playlist-btn *,
        .download-song-btn * {
            pointer-events: none;
        }
        
        .download-song-btn {
            color: #34c759;
        }
        
        .add-to-playlist-btn:active,
        .download-song-btn:active {
            transform: scale(0.9);
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        
        .download-song-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }
        
        
        /* 从歌单移除按钮 */
        .remove-from-playlist-btn {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 68, 68, 0.3);
            background: transparent;
            color: #ff4444;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: all var(--transition-fast);
        }
        
        .remove-from-playlist-btn:active {
            transform: scale(0.9);
            background: #ff4444;
            color: white;
        }
        
        /* 歌单详情返回按钮 */
        .back-to-list-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: var(--border-radius-xl);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
        }
        
        .back-to-list-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 歌单选择弹窗 */
        .playlist-select-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: background var(--transition-fast);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .playlist-select-item:active {
            background: rgba(255, 0, 110, 0.1);
        }
        
        .playlist-select-name {
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .playlist-select-count {
            font-size: 12px;
            color: var(--text-tertiary);
        }
        
        .playlist-select-new {
            color: var(--accent-neon);
            margin-top: 8px;
            border-bottom: none;
        }
        
        .modal-body {
            padding: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        
        /* 歌单页面 */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .create-playlist-btn {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--border-radius-xl);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--neon-glow);
        }
        
        .create-playlist-btn:active {
            transform: scale(0.95);
        }
        
        .playlist-card {
            background: var(--glass-bg);
            border-radius: var(--border-radius-md);
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .playlist-card:active {
            transform: scale(0.98);
            border-color: var(--accent-primary);
        }
        
        .playlist-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .playlist-count {
            font-size: 13px;
            color: var(--text-tertiary);
        }
        
        .playlist-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: var(--border-radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .action-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .delete-btn {
            color: var(--accent-primary);
        }
        
        /* 搜索页面 - 增强输入体验 */
        .search-container {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border-radius: var(--radius-2xl);
            padding: var(--space-3) var(--space-4);
            border: 2px solid var(--glass-border);
            margin-bottom: var(--space-5);
            transition: all var(--transition-normal);
            min-height: 56px;
        }
        
        .search-container:focus-within {
            background: var(--glass-bg-hover);
            border-color: var(--accent-neon);
            box-shadow: 0 0 0 3px rgba(0, 245, 212, 0.15), var(--shadow-md);
            transform: translateY(-2px);
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: var(--text-base);
            outline: none;
            min-width: 0;
            caret-color: var(--accent-neon);
            font-weight: 400;
        }
        
        .search-input::placeholder {
            color: var(--text-muted);
        }
        
        .search-btn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            color: white;
            font-size: var(--text-lg);
            cursor: pointer;
            padding: var(--space-2);
            min-width: var(--touch-target-min);
            min-height: var(--touch-target-min);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-full);
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-sm);
        }
        
        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: var(--neon-glow-pink);

        /* 底部导航栏 - 增强触控和视觉效果 */

            bottom: 0;

            right: 0;

            position: relative;
            padding: var(--space-2);

            content: '';

            inset: 0;

            transform: scale(0);

            content: '';

            left: 50%;

            height: 3px;

        .qq-logout-btn {

            color: var(--text-secondary);
        }
        
        .qq-login-btn:active,
        .qq-logout-btn:active {
            transform: scale(0.95);
        }
        
        .profile-stats {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
        }
        
        .profile-stat {

            background: rgba(255, 255, 255, 0.075);
            border: 1px solid rgba(255, 255, 255, 0.08);

        }
        
        .profile-stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-neon);
        }
        
        .profile-stat-label {
            margin-top: 2px;
            font-size: 11px;
            color: var(--text-tertiary);
        }
        
        /* 错误提示 */
        .error-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            color: white;
            padding: 12px 20px;

            font-size: 14px;
            z-index: 1000;
            opacity: 0;

            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: var(--neon-glow);
        }
        
        .error-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-tertiary);
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-tertiary);
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.3);
            display: block;
        }
        
            /* 响应式调整 */
            @media (max-width: 375px) {
                .full-cover {
                    width: 240px;

                }
                
                .full-title {

                }
                
                .full-artist {
                    font-size: 16px;
                }
                
                .full-controls {

                .mini-title {

                .mini-artist {

                }
                
                .control-btn {

                .play-btn {

            }
            
            @media (min-width: 768px) {

                    width: 320px;

                .mini-title {

                }
                
                .mini-artist {
                    font-size: 14px;
                }
            }
            
            /* 底部安全区域 - 使用更可靠的方案 */
            @supports (padding-bottom: env(safe-area-inset-bottom)) {
                .bottom-tab {
                    padding-bottom: env(safe-area-inset-bottom, 0px);
                }
                
                .mini-player {
                    bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px));
                }
                
                .main-content {
                    padding-bottom: calc(var(--player-bar-height) + var(--tab-height) + env(safe-area-inset-bottom, 0px) + 20px);
                }
                
                /* 当迷你播放器隐藏时 */
                .mini-player.hidden {
                    bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px));
                    transform: translateY(100%);
                }
            }
            
            /* ============================================
               SVG Icon System (Lucide-style)
               ============================================ */
            .icon-svg {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 20px;
                height: 20px;
                flex-shrink: 0;
            }
            
            .icon-svg svg {
                width: 100%;
                height: 100%;
                fill: none;
                stroke: currentColor;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            
            .icon-svg.icon-sm { width: 16px; height: 16px; }
            .icon-svg.icon-md { width: 20px; height: 20px; }
            .icon-svg.icon-lg { width: 24px; height: 24px; }
            .icon-svg.icon-xl { width: 32px; height: 32px; }
            
            /* ============================================
               Music Source Badge System
               ============================================ */
            .source-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                flex-shrink: 0;
                margin-left: 4px;
                vertical-align: middle;
                overflow: hidden;
            }
            
            .source-badge img {
                width: 100%;
                height: 100%;
                border-radius: 50%;
                object-fit: cover;
            }
            
            .source-badge-qq {
                background: #31c27c;
                box-shadow: 0 0 6px rgba(49, 194, 124, 0.4);
            }
            
            .source-badge-netease {
                background: #c20c0c;
                box-shadow: 0 0 6px rgba(194, 12, 12, 0.4);
            }
            
            .source-badges {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                flex-shrink: 0;
            }
            
            /* Large badge for playlists */
            .source-badge-lg {
                width: 24px;
                height: 24px;
                border-radius: 50%;
            }
            
            /* ============================================
               Cover Click → Lyrics Toggle
               ============================================ */
            .full-cover {
                cursor: pointer;
                position: relative;
            }
            
            .full-cover .lyrics-hint {
                position: absolute;
                bottom: 8px;
                right: 8px;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: rgba(0, 0, 0, 0.5);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                opacity: 0.7;
                transition: opacity var(--transition-fast);
                pointer-events: none;
            }
            
            .full-cover:active .lyrics-hint {
                opacity: 1;
            }
            
            /* ============================================
               Enhanced Glassmorphism & Animations
               ============================================ */
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            @keyframes fadeInScale {
                from {
                    opacity: 0;
                    transform: scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }
            
            @keyframes shimmer {
                0% { background-position: -200% 0; }
                100% { background-position: 200% 0; }
            }
            
            @keyframes slideInFromBottom {
                from { transform: translateY(100%); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
            
            .animate-fade-in-up {
                animation: fadeInUp 0.3s ease-out forwards;
            }
            
            .animate-fade-in-scale {
                animation: fadeInScale 0.25s ease-out forwards;
            }
            
            /* Stagger animation for song lists */
            .song-item {
                animation: fadeInUp 0.3s ease-out forwards;
                opacity: 0;
            }
            
            .song-item:nth-child(1) { animation-delay: 0.03s; }

            .song-item:nth-child(3) { animation-delay: 0.09s; }
            .song-item:nth-child(4) { animation-delay: 0.12s; }
            .song-item:nth-child(5) { animation-delay: 0.15s; }
            .song-item:nth-child(6) { animation-delay: 0.18s; }
            .song-item:nth-child(7) { animation-delay: 0.21s; }
            .song-item:nth-child(8) { animation-delay: 0.24s; }
            .song-item:nth-child(9) { animation-delay: 0.27s; }
            .song-item:nth-child(10) { animation-delay: 0.3s; }
            .song-item:nth-child(11) { animation-delay: 0.33s; }
            .song-item:nth-child(12) { animation-delay: 0.36s; }
            
            .recommend-card {
                animation: fadeInScale 0.3s ease-out forwards;
                opacity: 0;
            }
            
            .recommend-card:nth-child(1) { animation-delay: 0.05s; }
            .recommend-card:nth-child(2) { animation-delay: 0.1s; }
            .recommend-card:nth-child(3) { animation-delay: 0.15s; }
            .recommend-card:nth-child(4) { animation-delay: 0.2s; }
            
            .playlist-card {
                animation: fadeInUp 0.3s ease-out forwards;
                opacity: 0;
            }
            
            .playlist-card:nth-child(1) { animation-delay: 0.05s; }
            .playlist-card:nth-child(2) { animation-delay: 0.1s; }
            .playlist-card:nth-child(3) { animation-delay: 0.15s; }
            
            /* Enhanced recommend cards */
            .recommend-card {
                transition: all var(--transition-normal);
                will-change: transform;
            }
            
            .recommend-card:active {
                transform: scale(0.96);
                box-shadow: 0 0 24px rgba(255, 0, 110, 0.35);
            }
            
            /* Enhanced song items with ripple effect */
            .song-item {
                transition: all var(--transition-fast);
                position: relative;
                overflow: hidden;
            }
            
            .song-item::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 0;
                height: 0;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.08);
                transform: translate(-50%, -50%);
                transition: width 0.4s ease, height 0.4s ease, opacity 0.4s ease;
                opacity: 0;
                pointer-events: none;
                z-index: 0;
            }
            
            .song-item:active::after {
                width: 300px;
                height: 300px;
                opacity: 1;
                transition: width 0s, height 0s, opacity 0s;
            }
            
            /* Enhanced playlist cards */
            .playlist-card {
                position: relative;
                overflow: hidden;
            }
            
            .playlist-card::before {
                content: '';
                position: absolute;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: linear-gradient(135deg, rgba(255, 0, 110, 0.05), rgba(131, 56, 236, 0.05));
                opacity: 0;
                transition: opacity var(--transition-normal);
                pointer-events: none;
            }
            
            .playlist-card:active::before {
                opacity: 1;
            }
            
            /* Song name with source badge row */
            .song-name-row {
                display: flex;
                align-items: center;
                min-width: 0;

            .song-name-row .song-name {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;

            /* Source badge in playlist title */
            .playlist-title-row {

                align-items: center;
                gap: 6px;

            .playlist-title-row .playlist-title {

                overflow: hidden;
                text-overflow: ellipsis;
            }
            
            /* Play button icon */
            .btn-icon-play {
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
            
            /* Enhanced search input focus */
            .search-container {
                transition: all var(--transition-normal);
            }
            
            .search-container:focus-within {
                background: rgba(255, 255, 255, 0.12);
                border-color: var(--accent-primary);
                box-shadow: 0 0 0 3px rgba(255, 0, 110, 0.2);
                transform: scale(1.01);

            /* Reduced motion preference */
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation-duration: 0.01ms !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 0.01ms !important;
                }
            }

                    modalInput: document.getElementById('modalInput'),
                    modalCancel: document.getElementById('modalCancel'),
                    modalConfirm: document.getElementById('modalConfirm'),
                    
                    // 其他
                    errorToast: document.getElementById('errorToast'),
                    searchPageBtn: document.getElementById('searchPageBtn')
                };
            }
            
            // 初始化事件监听器
            initEventListeners() {
                // 底部导航
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.addEventListener('click', () => {
                        this.switchTab(tab.dataset.tab);
                    });
                });
                
                // 搜索相关事件
                this.elements.searchInput.addEventListener('input', this.handleSearchInput.bind(this));
                this.elements.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleSearch();
                });
                this.elements.searchBtn.addEventListener('click', this.handleSearch.bind(this));
                this.elements.searchPageBtn.addEventListener('click', () => {
                    this.switchTab('search');
                });
                
                // 播放控制事件
                this.elements.playBtn.addEventListener('click', this.togglePlay.bind(this));
                this.elements.prevBtn.addEventListener('click', this.playPrev.bind(this));
                this.elements.nextBtn.addEventListener('click', this.playNext.bind(this));
                
                // 全屏播放器事件
                this.elements.miniPlayer.addEventListener('click', this.showFullPlayer.bind(this));
                this.elements.backBtn.addEventListener('click', this.hideFullPlayer.bind(this));
                this.elements.fullPlayBtn.addEventListener('click', this.togglePlay.bind(this));
                this.elements.fullPrevBtn.addEventListener('click', this.playPrev.bind(this));
                this.elements.fullNextBtn.addEventListener('click', this.playNext.bind(this));
                this.elements.downloadCurrentBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.downloadCurrentSong();
                });
                this.elements.fullCover.addEventListener('click', this.toggleLyrics.bind(this));
                this.elements.lyricsCloseBtn.addEventListener('click', this.hideLyrics.bind(this));
                
                // 进度条事件
                this.elements.progressBar.addEventListener('mousedown', this.handleProgressMouseDown.bind(this));
                this.elements.progressBar.addEventListener('touchstart', this.handleProgressTouchStart.bind(this), { passive: false });
                document.addEventListener('mousemove', this.handleProgressMouseMove.bind(this));
                document.addEventListener('mouseup', this.handleProgressMouseUp.bind(this));
                document.addEventListener('touchmove', this.handleProgressTouchMove.bind(this), { passive: false });
                document.addEventListener('touchend', this.handleProgressTouchEnd.bind(this));
                
                // 音量控制事件
                this.elements.volumeSlider.addEventListener('input', this.handleVolumeChange.bind(this));
                
                // 音质选择事件
                this.elements.qualityButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.elements.qualityButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentQuality = btn.dataset.quality;
                        this.showSuccess(`已切换到${btn.textContent}音质`);
                    });
                });
                
                // 歌单创建
                this.elements.createPlaylistBtn.addEventListener('click', () => {
                    this.showModal('创建歌单', '请输入歌单名称', (name) => {
                        this.createPlaylist(name);
                    });
                });
                
                // 导入歌单
                this.elements.importBtn.addEventListener('click', this.handleImportPlaylist.bind(this));
                
                // QQ 登录
                this.elements.qqLoginBtn.addEventListener('click', this.handleQQLogin.bind(this));
                this.elements.qqInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleQQLogin();
                });
                this.elements.qqEditNameBtn.addEventListener('click', this.editQQNickname.bind(this));
                this.elements.qqLogoutBtn.addEventListener('click', this.logoutQQ.bind(this));
                
                // 模态框
                this.elements.modalCancel.addEventListener('click', this.hideModal.bind(this));
                this.elements.modalOverlay.addEventListener('click', (e) => {
                    if (e.target === this.elements.modalOverlay) {
                        this.hideModal();
                    }
                });
                
                // 点击歌曲列表项：按钮区域不触发播放，避免搜索结果里的“添加/下载”被全局点击吞掉
                document.addEventListener('click', (e) => {
                    if (e.target.closest('button, .add-to-playlist-btn, .download-song-btn, .remove-from-playlist-btn, .action-btn')) {
                        return;
                    }
                    const songItem = e.target.closest('.song-item');
                    if (songItem) {
                        const index = parseInt(songItem.dataset.index);
                        const source = songItem.dataset.source || 'home';
                        this.playSong(index, source);
                    }
                });
                
                // 首页推荐卡片点击
                document.addEventListener('click', (e) => {
                    const recommendCard = e.target.closest('.recommend-card');
                    if (recommendCard) {
                        const songId = parseInt(recommendCard.dataset.songId);
                        const song = presetSongs.find(s => s.id === songId);
                        if (song) {
                            const index = presetSongs.indexOf(song);
                            this.playSong(index, 'home');
                        }
                    }
                });
            }
            
            // 初始化音频事件
            initAudioEvents() {
                this.audio.addEventListener('timeupdate', this.updateProgress.bind(this));
                this.audio.addEventListener('ended', this.playNext.bind(this));
                this.audio.addEventListener('error', this.handleAudioError.bind(this));
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.elements.fullCover.classList.add('playing');
                });
                this.audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.elements.fullCover.classList.remove('playing');
                });
            }
            
            // 切换标签页
            switchTab(tabName) {
                // 更新标签状态
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.tab === tabName);
                });
                
                // 更新页面显示
                document.querySelectorAll('.page').forEach(page => {
                    page.classList.remove('active');
                });
                
                const pageMap = {
                    'home': 'homePage',
                    'playlist': 'playlistPage',
                    'search': 'searchPage',
                    'profile': 'profilePage'
                };
                
                if (pageMap[tabName]) {
                    document.getElementById(pageMap[tabName]).classList.add('active');
                }
                
                // 不再自动聚焦搜索框，避免点击底部“搜索”时直接弹出输入法并顶起页面
                if (tabName !== 'search' && this.elements.searchInput) {
                    this.elements.searchInput.blur();
                }
            }

            renderHomePage() {

                let gridHtml = '';

                                </div>
                            </div>
                            <div class="card-info">
                                <div class="card-title">${this.escapeHtml(song.name)}</div>
                                <div class="card-artist">${this.escapeHtml(song.artist)}</div>
                            </div>
                        </div>
                    `;
                });
                
                this.elements.recommendGrid.innerHTML = gridHtml;
                
                // 渲染歌曲列表

            // 渲染歌单列表
            renderPlaylists() {
                let html = '';
                
                if (Object.keys(this.playlists).length === 0) {
                    html = `
                        <div class="empty-state">
                            <span class="icon icon-svg icon-xl"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span>

                                <div class="playlist-title-row">
                                    <div class="playlist-title">${this.escapeHtml(playlist.name)}</div>
                                    ${this.getPlaylistSourceBadgeHTML(playlist)}
                                </div>
                                <div class="playlist-count">${playlist.songs.length} 首歌曲</div>
                                <div class="playlist-actions">
                                    <button class="action-btn" onclick="musicPlayer.editPlaylist('${id}')">编辑</button>

                                </div>

            // 显示歌单详情
            showPlaylistDetail(playlistId) {
                const playlist = this.playlists[playlistId];
                if (!playlist) return;
                
                // 切换到歌单页面并显示详情
                this.switchTab('playlist');
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <button class="back-to-list-btn" onclick="musicPlayer.backToPlaylistList()">
                            <span class="icon-svg icon-sm"><svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></span>
                            <span style="margin-left: 6px;">返回歌单列表</span>
                        </button>
                        <h3 style="font-size: 20px; margin-bottom: 5px;">${this.escapeHtml(playlist.name)}</h3>
                        <p style="color: var(--text-tertiary); font-size: 14px;">${playlist.songs.length} 首歌曲</p>
                        <button class="create-playlist-btn" onclick="musicPlayer.addSongToPlaylistModal('${playlistId}')" style="margin-top: 15px;">
                            + 添加歌曲
                        </button>
                    </div>

                        html += `
                            <div class="song-item" data-index="${index}" data-source="playlist:${playlistId}">
                                <span class="song-index">${index + 1}</span>
                                <div class="song-cover">
                                    <img loading="lazy" src="${song.coverUrl}" alt="${this.escapeHtml(song.name)}" 
                                         onerror="this.style.display='none';">
                                </div>
                                <div class="song-info">
                                    <div class="song-name-row">
                                        <div class="song-name">${this.escapeHtml(song.name)}</div>
                                        ${this.getSourceBadgeHTML(song)}
                                    </div>
                                    <div class="song-artist">${this.escapeHtml(song.artist)}</div>
                                </div>
                                <button class="download-song-btn" onclick="event.stopPropagation(); musicPlayer.downloadSongFromList('playlist:${playlistId}', ${index}, this)" title="下载歌曲">
                                    <span class="icon-svg icon-sm"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></span>
                                </button>
                                <button class="remove-from-playlist-btn" onclick="event.stopPropagation(); musicPlayer.removeFromPlaylist('${playlistId}', ${index})" title="从歌单移除">
                                    <span class="icon-svg icon-sm"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></span>
                                </button>

                this.elements.playlistList.innerHTML = html;
