            // 从歌单中移除歌曲
            backToPlaylistList() {
                this.switchTab('playlist');
                this.renderPlaylists();
            }
            
            removeFromPlaylist(playlistId, index) {
                const playlist = this.playlists[playlistId];
                if (!playlist || index < 0 || index >= playlist.songs.length) return;
                
                const songName = playlist.songs[index].name;
                playlist.songs.splice(index, 1);
                this.saveState();
                this.showPlaylistDetail(playlistId);
                this.showSuccess(`已从歌单移除 "${songName}"`);
            }
            
            // 添加歌曲到歌单模态框
            addSongToPlaylistModal(playlistId) {
                this.showModal('添加歌曲到歌单', '输入歌曲名称搜索添加', (keyword) => {
                    this.searchAndAddToPlaylist(keyword, playlistId);
                });
            }
            
            // 搜索并添加歌曲到歌单
            async searchAndAddToPlaylist(keyword, playlistId) {
                try {
                    const results = await this.searchSongs(keyword);
                    if (results && results.length > 0) {
                        const song = results[0]; // 取第一首
                        this.addToPlaylist(playlistId, song);
                        this.showSuccess(`已添加 "${song.name}" 到歌单`);
                    } else {
                        this.showError('未找到相关歌曲');
                    }
                } catch (error) {
                    this.showError('搜索失败，请重试');
                }
            }
            
            // 创建歌单
            createPlaylist(name) {
                if (!name || !name.trim()) return;
                
                const id = 'playlist_' + Date.now();
                this.playlists[id] = {
                    name: name.trim(),
                    songs: [],
                    created: Date.now()
                };
                
                this.renderPlaylists();
                this.saveState();
                this.hideModal();
                this.showSuccess(`歌单 "${name}" 创建成功`);
            }
            
            // 编辑歌单
            editPlaylist(playlistId) {
                const playlist = this.playlists[playlistId];
                if (!playlist) return;
                
                this.showModal('编辑歌单名称', playlist.name, (newName) => {
                    if (newName && newName.trim()) {
                        playlist.name = newName.trim();
                        this.renderPlaylists();
                        this.saveState();
                        this.showSuccess('歌单名称已更新');
                    }
                });
            }
            
            // 删除歌单
            deletePlaylist(playlistId) {
                if (confirm('确定要删除这个歌单吗？')) {
                    delete this.playlists[playlistId];
                    this.renderPlaylists();
                    this.saveState();
                    this.showSuccess('歌单已删除');
                }
            }
            
            // 添加歌曲到歌单
            addToPlaylist(playlistId, song) {
                const playlist = this.playlists[playlistId];
                if (!playlist) return;
                
                // 检查是否已存在
                const exists = playlist.songs.some(s => s.songmid === song.songmid);
                if (exists) {
                    this.showError('歌曲已在歌单中');
                    return;
                }
                
                playlist.songs.push({...song});
                this.saveState();
            }
            
            // 处理搜索输入（防抖）
            handleSearchInput() {
                clearTimeout(this.searchTimer);
                this.searchTimer = setTimeout(() => {
                    if (this.elements.searchInput.value.trim()) {
                        this.handleSearch();
                    }
                }, 500);
            }
            
            // 处理搜索请求
            async handleSearch() {
                const keyword = this.elements.searchInput.value.trim();
                if (!keyword) return;
                
                // 显示加载状态
                this.elements.searchLoading.classList.add('active');
                this.elements.searchEmpty.style.display = 'none';
                this.elements.searchResults.innerHTML = '';
                
                try {
                    // 使用JSONP请求QQ音乐搜索接口
                    const results = await this.searchSongs(keyword);
                    
                    if (results && results.length > 0) {
                        this.searchResults = results;
                        this.renderSearchResults(results);
                    } else {
                        this.elements.searchEmpty.innerHTML = '<span class="icon icon-svg icon-xl"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></span><p>未找到相关歌曲</p>';
                        this.elements.searchEmpty.style.display = 'block';
                    }
                } catch (error) {
                    console.error('搜索失败:', error);
                    this.showError('搜索失败，请稍后再试');
                } finally {
                    this.elements.searchLoading.classList.remove('active');
                }
            }
            
            // 聚合搜索歌曲：同时搜索 QQ 音乐与网易云音乐，合并并去重
            async searchSongs(keyword) {
                const tasks = [
                    this.searchSongsFromQQ(keyword).catch(error => {
                        console.log('QQ音乐搜索失败:', error.message);
                        return [];
                    }),
                    this.searchSongsFromNetease(keyword).catch(error => {
                        console.log('网易云音乐搜索失败:', error.message);
                        return [];
                    })
                ];
                
                const [qqSongs, neteaseSongs] = await Promise.all(tasks);
                return this.mergeSearchResults(qqSongs, neteaseSongs);
            }
            
            // JSONP搜索QQ音乐 - 使用完整搜索接口获取更多结果
            searchSongsFromQQ(keyword) {
                return new Promise((resolve, reject) => {
                    const callbackName = 'SearchCallback' + Date.now() + Math.floor(Math.random() * 1000);
                    let script;
                    
                    const cleanup = () => {
                        delete window[callbackName];
                        if (script && script.parentNode) script.remove();
                    };
                    
                    const timeout = setTimeout(() => {
                        cleanup();
                        resolve([]);
                    }, 10000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeout);
                        cleanup();
                        
                        try {
                            if (data && data.data && data.data.song && data.data.song.list) {
                                const songs = data.data.song.list;
                                const processedSongs = songs.map((song) => {
                                    const albumMid = song.albummid || '';
                                    const coverUrl = albumMid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${albumMid}.jpg` : null;
                                    const singers = Array.isArray(song.singer) ? song.singer.map(s => s.name).join(' / ') : '未知歌手';
                                    
                                    return {
                                        id: song.songmid || song.mid,
                                        name: song.songname || song.name || '未知歌曲',
                                        artist: singers,
                                        duration: song.interval ? this.formatTime(song.interval) : '未知',
                                        album: song.albumname || '未知专辑',
                                        songmid: song.songmid || song.mid,
                                        albummid: albumMid,
                                        coverUrl: coverUrl,
                                        source: 'qq'
                                    };
                                });
                                resolve(processedSongs);
                            } else {
                                resolve([]);
                            }
                        } catch (error) {
                            reject(error);
                        }
                    };
                    
                    script = document.createElement('script');
                    script.src = `https://c.y.qq.com/soso/fcgi-bin/search_cp?w=${encodeURIComponent(keyword)}&p=1&n=20&cr=1&catZhida=1&format=jsonp&new_json=1&lossless=0&aggr=1&remoteplace=txt.yqq.song&g_tk=5381&jsonpCallback=${callbackName}&loginUin=0&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq&needNewCode=0`;
                    
                    script.onerror = () => {
                        clearTimeout(timeout);
                        cleanup();
                        resolve([]);
                    };
                    
                    document.head.appendChild(script);
                });
            }
            
            // 搜索网易云音乐：使用支持 CORS 的第三方网易云 API，前端可免代理直连
            async searchSongsFromNetease(keyword) {
                const resp = await fetch(`https://apis.netstart.cn/music/cloudsearch?keywords=${encodeURIComponent(keyword)}&limit=20`, {
                    signal: AbortSignal.timeout(12000)
                });
                
                if (!resp.ok) return [];
                const data = await resp.json();
                const songs = data && data.result && Array.isArray(data.result.songs) ? data.result.songs : [];
                
                return songs.map(song => {
                    // netstart/cloudsearch 返回的新接口字段一般是 ar/al/dt；部分兼容接口可能是 artists/album/duration
                    const artistList = Array.isArray(song.ar) ? song.ar : (Array.isArray(song.artists) ? song.artists : []);
                    const artists = artistList.length > 0 ? artistList.map(a => a.name).join(' / ') : '未知歌手';
                    const album = song.al || song.album || {};
                    const durationMs = song.dt || song.duration || 0;
                    
                    return {
                        id: String(song.id),
                        name: song.name || '未知歌曲',
                        artist: artists,
                        duration: durationMs ? this.formatTime(Math.round(durationMs / 1000)) : '未知',
                        album: album.name || '未知专辑',
                        songmid: String(song.id),
                        albummid: album.id ? String(album.id) : '',
                        coverUrl: album.picUrl || null,
                        source: 'netease'
                    };
                });
            }
            
            // 合并搜索结果：优先保留不同平台的结果，只去掉同平台完全重复项
            mergeSearchResults(...songGroups) {
                const merged = [];
                const seen = new Set();
                
                songGroups.flat().forEach(song => {
                    if (!song || !song.name) return;
                    const key = `${song.source || 'unknown'}:${song.songmid || song.id || `${song.name}-${song.artist}`}`;
                    if (seen.has(key)) return;
                    seen.add(key);
                    merged.push(song);
                });
                
                return merged;
            }
            
            // 渲染搜索结果
            renderSearchResults(songs) {
                let html = '';
                
                songs.forEach((song, index) => {
                    html += `
                        <div class="song-item" data-index="${index}" data-source="search">
                            <span class="song-index">${index + 1}</span>
                            <div class="song-cover">
                                ${song.coverUrl ? 
                                    `<img loading="lazy" src="${song.coverUrl}" alt="${this.escapeHtml(song.name)}" 
                                         onerror="this.style.display='none';">` :
                                    `<span class="icon-svg icon-lg"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>`
                                }
                            </div>
                            <div class="song-info">
                                <div class="song-name-row">
                                    <div class="song-name">${this.escapeHtml(song.name)}</div>
                                    ${this.getSourceBadgeHTML(song)}
                                </div>
                                <div class="song-artist">${this.escapeHtml(song.artist)}</div>
                            </div>
                            <button type="button" class="add-to-playlist-btn" data-song-index="${index}" title="添加到歌单">
                                <span class="icon-svg icon-sm"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></span>
                            </button>
                            <button type="button" class="download-song-btn" data-song-index="${index}" title="下载歌曲">
                                <span class="icon-svg icon-sm"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg></span>
                            </button>
                            <span class="song-duration">${song.duration}</span>
                        </div>
                    `;
                });
                
                this.elements.searchResults.innerHTML = html;
                
                // 搜索结果按钮通过父容器事件委托处理，避免动态渲染后按钮事件丢失
                this.bindSearchResultActions();
            }
            
            // 绑定搜索结果里的添加/下载按钮。click + touchend 双通道，适配 Android WebView
            bindSearchResultActions() {
                if (!this.elements.searchResults) return;

                const handleAction = (e) => {
                    const actionBtn = e.target.closest('.add-to-playlist-btn, .download-song-btn');
                    if (!actionBtn || !this.elements.searchResults.contains(actionBtn)) return;

                    e.preventDefault();
                    e.stopPropagation();
                    if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();

                    const songIndex = Number(actionBtn.dataset.songIndex);
                    if (!Number.isInteger(songIndex)) {
                        this.showError('歌曲索引异常，请重新搜索');
                        return;
                    }

                    const song = this.searchResults[songIndex];
                    if (!song) {
                        this.showError('未找到这首歌，请重新搜索');
                        return;
                    }

                    if (actionBtn.classList.contains('add-to-playlist-btn')) {
                        this.showAddToPlaylistMenu(song);
                    } else if (actionBtn.classList.contains('download-song-btn')) {
                        this.downloadSongFromList('search', songIndex, actionBtn);
                    }
                };

                this.elements.searchResults.onclick = handleAction;
                this.elements.searchResults.ontouchend = handleAction;
            }
            
            // 显示添加到歌单的菜单
            showAddToPlaylistMenu(song) {
                if (!song) {
                    this.showError('未找到要添加的歌曲');
                    return;
                }
                const playlistIds = Object.keys(this.playlists);
                
                if (playlistIds.length === 0) {
                    // 没有歌单，提示创建
                    const name = prompt('还没有歌单，输入歌单名称创建一个：');
                    if (name && name.trim()) {
                        const id = 'pl_' + Date.now();
                        this.playlists[id] = { name: name.trim(), songs: [] };
                        this.addToPlaylist(id, song);
                        this.renderPlaylists();
                        this.saveState();
                    }
                    return;
                }
                
                // 构建歌单选择弹窗
                let playlistOptions = playlistIds.map(id => 
                    `<div class="playlist-select-item" data-id="${id}">
                        <span class="playlist-select-name">${this.escapeHtml(this.playlists[id].name)}</span>
                        <span class="playlist-select-count">${this.playlists[id].songs.length}首</span>
                    </div>`
                ).join('');
                
                // 使用modalOverlay
                const overlay = this.elements.modalOverlay;
                overlay.querySelector('.modal-title').textContent = `添加 "${song.name}" 到歌单`;
                overlay.querySelector('.modal-body').innerHTML = `
                    ${playlistOptions}
                    <div class="playlist-select-item playlist-select-new" id="createAndAdd">
                        <span>➕</span>
                        <span class="playlist-select-name">新建歌单</span>
                    </div>
                `;
                overlay.classList.add('active');
                
                // 绑定点击事件
                overlay.querySelectorAll('.playlist-select-item').forEach(item => {
                    item.addEventListener('click', () => {
                        if (item.id === 'createAndAdd') {
                            const name = prompt('输入新歌单名称：');
                            if (name && name.trim()) {
                                const id = 'pl_' + Date.now();
                                this.playlists[id] = { name: name.trim(), songs: [] };
                                this.addToPlaylist(id, song);
                                this.renderPlaylists();
                            }
                        } else {
                            this.addToPlaylist(item.dataset.id, song);
                        }
                        overlay.classList.remove('active');
                    });
                });
            }
            
            // 播放歌曲
            async playSong(index, source = 'home') {
                let song;
                
                if (source === 'home') {
                    if (index < 0 || index >= presetSongs.length) return;
                    song = presetSongs[index];
                    this.currentPlaylist = 'home';
                } else if (source === 'search') {
                    if (index < 0 || index >= this.searchResults.length) return;
                    song = this.searchResults[index];
                    this.currentPlaylist = 'search';
                } else if (source.startsWith('playlist:')) {
                    const playlistId = source.split(':')[1];
                    const playlist = this.playlists[playlistId];
                    if (!playlist || index < 0 || index >= playlist.songs.length) return;
                    song = playlist.songs[index];
                    this.currentPlaylist = source;
                }
                
                if (!song) return;
                
                this.currentSongIndex = index;
                this.currentSong = {...song};
                
                // 更新UI
                this.updatePlayerUI(song);
                
                // 添加到播放历史
                this.addToHistory(song);
                
                // 保存状态
                this.saveState();
                
                // 获取歌曲URL
                try {
                    const songUrl = await this.getSongUrl(song);
                    
                    if (songUrl) {
                        this.audio.src = songUrl;
                        this.highlightCurrentSong();
                        
                        // 加载歌词 - 传入完整歌曲对象，便于按来源选择歌词API
                        this.loadLyrics(song);
                        
                        try {
                            await this.audio.play();
                        } catch (playError) {
                            console.log('自动播放被阻止，请点击播放按钮');
                        }
                    } else {
                        this.showError('无法播放此歌曲，可能是付费歌曲或版权限制');
                    }
                } catch (error) {
                    console.error('获取歌曲URL失败:', error);
                    this.showError('播放失败，请尝试其他歌曲');
                }
            }
            
            // 下载当前歌曲
            downloadCurrentSong() {
                if (!this.currentSong) {
                    this.showError('当前没有可下载的歌曲');
                    return;
                }
                this.downloadSong(this.currentSong, this.elements.downloadCurrentBtn);
            }
            
            // 从列表下载歌曲
            downloadSongFromList(source, index, triggerBtn = null) {
                const song = this.getSongBySourceAndIndex(source, index);
                if (!song) {
                    this.showError('未找到要下载的歌曲');
                    return;
                }
                this.downloadSong(song, triggerBtn);
            }
            
            // 根据列表来源和索引取歌曲
            getSongBySourceAndIndex(source, index) {
                if (source === 'home') return presetSongs[index] || null;
                if (source === 'search') return this.searchResults[index] || null;
                if (source && source.startsWith('playlist:')) {
                    const playlistId = source.split(':')[1];
                    const playlist = this.playlists[playlistId];
                    return playlist && playlist.songs ? (playlist.songs[index] || null) : null;
                }
                return null;
            }
            
            // 下载歌曲：只下载现有播放链路能合法获取到的音频URL，不绕过版权限制
            async downloadSong(song, triggerBtn = null) {
                if (!song) return;
                
                const originalHtml = triggerBtn ? triggerBtn.innerHTML : '';
                if (triggerBtn) {
                    triggerBtn.disabled = true;
                    triggerBtn.innerHTML = '<span class="icon-svg icon-sm"><svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></span>';
                }
                
                try {
                    this.showSuccess(`正在准备下载 "${song.name}"...`);
                    const songUrl = await this.getSongUrl(song);
                    
                    if (!songUrl) {
                        this.showError('无法下载：歌曲可能受付费或版权限制');
                        return;
                    }
                    
                    const filename = this.buildDownloadFilename(song, songUrl);
                    await this.triggerBrowserDownload(songUrl, filename);
                    this.showSuccess(`已开始下载 "${song.name}"`);
                } catch (error) {
                    console.error('下载失败:', error);
                    this.showError('下载失败，可能是浏览器或跨域限制');
                } finally {
                    if (triggerBtn) {
                        triggerBtn.disabled = false;
                        triggerBtn.innerHTML = originalHtml;
                    }
                }
            }
            
            // 触发浏览器下载，优先转 Blob 以提升跨域音频下载兼容性
            async triggerBrowserDownload(url, filename) {
                let downloadUrl = url;
                let revokeAfterDownload = false;
                
                try {
                    if (!url.startsWith('blob:')) {
                        const resp = await fetch(url, { signal: AbortSignal.timeout(30000) });
                        if (resp.ok) {
                            const blob = await resp.blob();
                            if (blob.size > 10000) {
                                downloadUrl = URL.createObjectURL(blob);
                                revokeAfterDownload = true;
                            }
                        }
                    }
                } catch (error) {
                    console.log('转Blob下载失败，尝试直接下载URL:', error.message);
                }
                
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = filename;
                a.rel = 'noopener';
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                if (revokeAfterDownload) {
                    setTimeout(() => URL.revokeObjectURL(downloadUrl), 30000);
                }
            }
            
            // 生成安全下载文件名
            buildDownloadFilename(song, url = '') {
                const ext = this.getAudioExtension(url, song.source);
                const artist = song.artist || '未知歌手';
                const name = song.name || '未知歌曲';
                return `${this.sanitizeFilename(artist)} - ${this.sanitizeFilename(name)}.${ext}`;
            }
            
            getAudioExtension(url = '', source = 'qq') {
                const cleanUrl = (url || '').split('?')[0].toLowerCase();
                const match = cleanUrl.match(/\.([a-z0-9]{2,5})$/);
                if (match && ['mp3', 'm4a', 'flac', 'ogg', 'wav', 'aac'].includes(match[1])) return match[1];
                if (this.currentQuality === 'flac') return 'flac';
                if (this.currentQuality === 'm4a') return 'm4a';
                return source === 'qq' && this.currentQuality === 'm4a' ? 'm4a' : 'mp3';
            }
            
            sanitizeFilename(text) {
                return String(text || '')
                    .replace(/[\\/:*?"|]/g, '_')
                    .replaceAll(String.fromCharCode(60), '_')
                    .replaceAll(String.fromCharCode(62), '_')
                    .replace(/\s+/g, ' ')
                    .trim()
                    .slice(0, 80) || 'music';
            }
            
            // 添加到播放历史
            addToHistory(song) {
                // 移除已存在的相同歌曲
                this.playHistory = this.playHistory.filter(s => s.songmid !== song.songmid);
                
                // 添加到开头
                this.playHistory.unshift({...song});
                
                // 限制历史记录数量
                if (this.playHistory.length > 50) {
                    this.playHistory = this.playHistory.slice(0, 50);
                }
                
                this.renderHistory();
                this.saveState();
            }
            
            // QQ号登录：拉取公开头像与昵称
            async handleQQLogin() {
                const qq = (this.elements.qqInput.value || '').trim();
                if (!/^\d{5,12}$/.test(qq)) {
                    this.showError('请输入正确的 QQ 号');
                    return;
                }
                
                const originalText = this.elements.qqLoginBtn.textContent;
                this.elements.qqLoginBtn.disabled = true;
                this.elements.qqLoginBtn.textContent = '登录中';
                
                try {
                    const profile = await this.fetchQQProfile(qq);
                    this.qqUser = profile;
                    this.saveState();
                    this.renderQQProfile();
                    this.showSuccess(`欢迎回来，${profile.nickname}`);
                } catch (error) {
                    console.warn('QQ资料获取失败:', error);
                    this.showError('QQ资料获取失败，请检查网络或QQ号');
                } finally {
                    this.elements.qqLoginBtn.disabled = false;
                    this.elements.qqLoginBtn.textContent = originalText;
                }
            }
            
            // 使用 QQ 官方公开头像接口 + QQ空间公开资料获取昵称
            async fetchQQProfile(qq) {
                const avatarUrl = `https://q1.qlogo.cn/g?b=qq&nk=${encodeURIComponent(qq)}&s=640`;
                let nickname = await this.fetchQQNicknameTextDecoded(qq);
                if (!nickname) nickname = await this.fetchQQNicknameByJSONP(qq);
                nickname = this.normalizeQQNickname(nickname);
                if (!nickname) nickname = `QQ ${qq}`;
                
                return {
                    qq,
                    nickname,
                    avatarUrl,
                    loginTime: Date.now(),
                    nicknameSynced: !!nickname && nickname !== `QQ ${qq}`
                };
            }
            
            // 优先用 ArrayBuffer + GB18030 手动解码，解决 QQ 老接口中文乱码
            async fetchQQNicknameTextDecoded(qq) {
                const urls = [
                    `http://users.qzone.qq.com/fcg-bin/cgi_get_portrait.fcg?uins=${encodeURIComponent(qq)}&_=${Date.now()}`,
                    `https://users.qzone.qq.com/fcg-bin/cgi_get_portrait.fcg?uins=${encodeURIComponent(qq)}&_=${Date.now()}`,
                    `https://r.qzone.qq.com/fcg-bin/cgi_get_portrait.fcg?uins=${encodeURIComponent(qq)}&_=${Date.now()}`
                ];
                
                for (const url of urls) {
                    try {
                        const resp = await fetch(url, {
                            signal: AbortSignal.timeout(8000),
                            cache: 'no-store'
                        });
                        if (!resp.ok) continue;
                        const buffer = await resp.arrayBuffer();
                        const text = this.decodeQQPortraitBuffer(buffer);
                        const nickname = this.extractQQNicknameFromText(text, qq);
                        if (nickname) return nickname;
                    } catch (error) {
                        console.log('QQ昵称二进制解码接口失败:', url, error.message);
                    }
                }
                return '';
            }
            
            decodeQQPortraitBuffer(buffer) {
                const encodings = ['gb18030', 'gbk', 'gb2312', 'utf-8'];
                let fallbackText = '';
                for (const encoding of encodings) {
                    try {
                        const text = new TextDecoder(encoding).decode(buffer);
                        if (!fallbackText) fallbackText = text;
                        if (text && !this.isMojibakeText(text)) return text;
                    } catch (e) {}
                }
                return fallbackText;
            }
            
            extractQQNicknameFromText(text, qq) {
                if (!text) return '';
                const match = text.match(/portraitCallBack\((.*)\)/s);
                if (!match || !match[1]) return '';
                try {
                    const data = JSON.parse(match[1]);
                    const item = data && data[qq];
                    const candidates = Array.isArray(item)
                        ? [item[6], item[5], item[4], item[3], item[item.length - 1]]
                        : [];
                    const name = candidates.find(v => typeof v === 'string' && v.trim() && !/^\d+$/.test(v.trim()));
                    return name ? this.normalizeQQNickname(name) : '';
                } catch (error) {
                    console.log('解析QQ资料文本失败:', error.message, text.slice(0, 80));
                    return '';
                }
            }
            
            // QQ空间资料接口通常不支持 fetch CORS，用 script JSONP 避免昵称拿不到
            async fetchQQNicknameByJSONP(qq) {
                const urls = [
                    // 用户反馈：浏览器直接访问该老接口可正常返回昵称，优先使用；charset=gbk 用于修复中文乱码
                    { url: `http://users.qzone.qq.com/fcg-bin/cgi_get_portrait.fcg?uins=${encodeURIComponent(qq)}&_=${Date.now()}`, charset: 'gb2312' },
                    // 备用域名
                    { url: `https://r.qzone.qq.com/fcg-bin/cgi_get_portrait.fcg?uins=${encodeURIComponent(qq)}&_=${Date.now()}`, charset: 'gb2312' }
                ];
                
                // HTTPS 页面加载 HTTP JSONP 可能被浏览器 Mixed Content 拦截，自动追加 HTTPS 变体兜底
                if (location.protocol === 'https:') {
                    urls.push({ url: `https://users.qzone.qq.com/fcg-bin/cgi_get_portrait.fcg?uins=${encodeURIComponent(qq)}&_=${Date.now()}`, charset: 'gb2312' });
                }
                
                for (const item of urls) {
                    const nickname = await this.loadQQPortraitJSONP(item.url, qq, item.charset);
                    if (nickname) return nickname;
                }
                return '';
            }
            
            loadQQPortraitJSONP(url, qq, charset = 'gbk') {
                return new Promise((resolve) => {
                    const callbackName = 'portraitCallBack';
                    const previousCallback = window[callbackName];
                    let script;
                    let settled = false;
                    
                    const restore = () => {
                        if (script && script.parentNode) script.remove();
                        if (previousCallback) {
                            window[callbackName] = previousCallback;
                        } else {
                            try { delete window[callbackName]; } catch (e) { window[callbackName] = undefined; }
                        }
                    };
                    
                    const finish = (name = '') => {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timeout);
                        restore();
                        resolve(name);
                    };
                    
                    const timeout = setTimeout(() => finish(''), 8000);
                    
                    window[callbackName] = (data) => {
                        try {
                            const item = data && data[qq];
                            const candidates = Array.isArray(item)
                                ? [item[6], item[5], item[4], item[3], item[item.length - 1]]
                                : [];
                            const name = candidates.find(v => typeof v === 'string' && v.trim() && !/^\d+$/.test(v.trim()));
                            finish(name ? this.normalizeQQNickname(name) : '');
                        } catch (error) {
                            console.log('解析QQ昵称失败:', error.message);
                            finish('');
                        }
                    };
                    
                    script = document.createElement('script');
                    script.charset = charset;
                    script.setAttribute('charset', charset);
                    script.src = url;
                    script.onerror = () => finish('');
                    document.head.appendChild(script);
                });
            }
            
            normalizeQQNickname(name) {
                return String(name || '')
                    .replace(/[\u0000-\u001f\u007f]/g, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }
            
            isMojibakeText(text) {
                return /�|锟|�|Ã|Â/.test(String(text || ''));
            }
            
            async refreshQQProfileIfNeeded() {
                if (!this.qqUser || !this.qqUser.qq) return;
                const shouldRefresh = this.isMojibakeText(this.qqUser.nickname) || !this.qqUser.nicknameSynced;
                if (!shouldRefresh) return;
                
                try {
                    if (this.qqUser.nicknameManual) return;
                    const profile = await this.fetchQQProfile(this.qqUser.qq);
                    if (profile && profile.nicknameSynced) {
                        this.qqUser = profile;
                        this.saveState();
                        this.renderQQProfile();
                    }
                } catch (error) {
                    console.log('刷新QQ昵称失败:', error.message);
                }
            }
            
            editQQNickname() {
                if (!this.qqUser) return;
                this.showModal('修改显示昵称', this.qqUser.nickname || '请输入昵称', (name) => {
                    const nickname = this.normalizeQQNickname(name);
                    if (!nickname) {
                        this.showError('昵称不能为空');
                        return;
                    }
                    this.qqUser.nickname = nickname;
                    this.qqUser.nicknameSynced = true;
                    this.qqUser.nicknameManual = true;
                    this.saveState();
                    this.renderQQProfile();
                    this.hideModal();
                    this.showSuccess('昵称已保存');
                });
            }
            
            // 退出 QQ 登录
            logoutQQ() {
                this.qqUser = null;
                this.elements.qqInput.value = '';
                this.saveState();
                this.renderQQProfile();
                this.showSuccess('已退出登录');
            }
            
            // 渲染 QQ 用户资料卡
            renderQQProfile() {
                if (!this.elements.profileName) return;
                const playlistCount = Object.keys(this.playlists || {}).length;
                const historyCount = (this.playHistory || []).length;
                this.elements.profilePlaylistCount.textContent = playlistCount;
                this.elements.profileHistoryCount.textContent = historyCount;
                
                if (this.qqUser) {

                    this.elements.profileName.textContent = this.qqUser.nickname || `QQ ${this.qqUser.qq}`;
                    this.elements.profileSubtitle.textContent = this.qqUser.nicknameManual
                        ? `QQ ${this.qqUser.qq} · 使用自定义昵称`
                        : (this.qqUser.nicknameSynced
                            ? `QQ ${this.qqUser.qq} · 昵称与头像已同步`
                            : `QQ ${this.qqUser.qq} · 昵称接口异常，可点“改名”修正`);
                    this.elements.qqLoginForm.style.display = 'none';
                    this.elements.qqEditNameBtn.style.display = 'block';
                    this.elements.qqLogoutBtn.style.display = 'block';
                    this.elements.profileSourceLabel.textContent = 'QQ';
                } else {
                    const card = document.getElementById('profileLoginCard');
                    if (card) card.classList.remove('logged-in');
                    this.elements.profileAvatar.innerHTML = '<span class="icon-svg icon-xl"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>';
                    this.elements.profileName.textContent = '未登录';
                    this.elements.profileSubtitle.textContent = '输入 QQ 号同步头像和昵称';
                    this.elements.qqLoginForm.style.display = 'flex';
                    this.elements.qqEditNameBtn.style.display = 'none';
                    this.elements.qqLogoutBtn.style.display = 'none';
                    this.elements.profileSourceLabel.textContent = 'QQ';
                }
            }
            
            // 渲染播放历史
            renderHistory() {
                if (this.playHistory.length === 0) {
                    this.elements.historyList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon icon-svg icon-xl"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span>
                        <p>暂无播放历史</p>
                    </div>
                `;
                    this.renderQQProfile();
                    return;
                }
                
                let html = '';
                this.playHistory.forEach((song, index) => {
                    html += `

            // 从QQ音乐官方API获取播放URL
            async _getSongUrlFromQQ(songmid) {
                // 根据用户选择的音质确定格式顺序
                const qualityMap = {
                    'm4a':  { prefix: 'C400', ext: '.m4a', name: '标准M4A' },
                    '128':  { prefix: 'M500', ext: '.mp3', name: '128kbps MP3' },
                    '320':  { prefix: 'M800', ext: '.mp3', name: '320kbps MP3' },
                    'flac': { prefix: 'F000', ext: '.flac', name: 'FLAC无损' }
                };
                
                // 回退顺序：选定的音质 -> 320 -> 128 -> m4a -> ogg
                const fallbackOrder = ['320', '128', 'm4a'];
                
                // 把选定音质放最前面
                if (this.currentQuality && !fallbackOrder.includes(this.currentQuality)) {
                    fallbackOrder.unshift(this.currentQuality);
                } else if (this.currentQuality) {
                    fallbackOrder.unshift(this.currentQuality);
                }
                
                // 去重
                const seen = new Set();
                const ordered = fallbackOrder.filter(q => {
                    if (seen.has(q)) return false;
                    seen.add(q);
                    return true;
                });
                
                // 额外加入OGG格式作为最终回退
                const formats = ordered.map(q => qualityMap[q]);
                formats.push({ prefix: 'O400', ext: '.ogg', name: '64kbps OGG' });
                
                // 尝试每种格式
                for (const format of formats) {
                    try {
                        const url = await this.tryGetSongUrl(songmid, format.prefix, format.ext);
                        if (url) {
                            console.log(`成功获取歌曲URL (${format.name}): ${songmid}`);
                            return url;
                        }
                    } catch (error) {
                        console.log(`格式 ${format.name} 尝试失败:`, error.message);
                    }
                }
                
                return null;
            }

            async _getSongUrlFromMeting(songmid, source = 'qq') {

            // 尝试获取特定格式的歌曲URL
            tryGetSongUrl(songmid, prefix, ext) {
                return new Promise((resolve, reject) => {
                    // 生成安全的回调函数名（只包含字母数字）
                    const callbackName = 'MusicuCb' + Date.now() + Math.floor(Math.random() * 1000);
                    const filename = `${prefix}${songmid}${ext}`;
                    
                    // 设置超时
                    const timeoutId = setTimeout(() => {
                        delete window[callbackName];
                        resolve(null);
                    }, 3000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeoutId);
                        delete window[callbackName];
                        
                        try {
                            // JSONP GET请求返回req_0，POST请求返回req_1
                            const reqData = (data && data.req_1) || (data && data.req_0);
                            if (reqData && reqData.data) {
                                const sip = reqData.data.sip || [];
                                const midurlinfo = reqData.data.midurlinfo;
                                
                                if (midurlinfo && midurlinfo[0]) {
                                    const purl = midurlinfo[0].purl;
                                    if (purl && purl.length > 0) {
                                        // 有有效的purl - 确保使用HTTPS
                                        let fullUrl;
                                        if (sip.length > 0) {
                                            fullUrl = sip[0] + purl;
                                        } else {
                                            fullUrl = 'https://dl.stream.qqmusic.qq.com/' + purl;
                                        }
                                        // 强制转换为HTTPS
                                        fullUrl = fullUrl.replace(/^http:\/\//, 'https://');
                                        
                                        // 验证URL是否可以加载音频数据
                                        const testAudio = new Audio();
                                        testAudio.src = fullUrl;
                                        
                                        // 设置验证超时
                                        const verifyTimeoutId = setTimeout(() => {
                                            testAudio.onerror = null;
                                            testAudio.oncanplaythrough = null;
                                            resolve(null); // 验证超时，返回null
                                        }, 5000);
                                        
                                        testAudio.oncanplaythrough = () => {
                                            // 验证成功
                                            clearTimeout(verifyTimeoutId);
                                            testAudio.onerror = null;
                                            testAudio.oncanplaythrough = null;
                                            console.log(`URL验证成功: ${fullUrl}`);
                                            resolve(fullUrl);
                                        };
                                        
                                        testAudio.onerror = () => {
                                            // 验证失败
                                            clearTimeout(verifyTimeoutId);
                                            testAudio.onerror = null;
                                            testAudio.oncanplaythrough = null;
                                            console.log(`URL验证失败: ${fullUrl}`);
                                            resolve(null);
                                        };
                                        
                                        testAudio.load();
                                    } else {
                                        // purl为空，此格式不可用
                                        resolve(null);
                                    }
                                } else {
                                    resolve(null);
                                }
                            } else {
                                resolve(null);
                            }
                        } catch (error) {
                            reject(error);
                        }
                    };
                    
                    // 构建请求参数
                    const requestData = {
                        req_0: {
                            module: "vkey.GetVkeyServer",
                            method: "CgiGetVkey",
                            param: {
                                guid: this.generateGuid(),
                                songmid: [songmid],
                                songtype: [0],
                                uin: "0",
                                loginflag: 1,
                                platform: "20",
                                filename: [filename]
                            }
                        },
                        loginUin: "0",
                        comm: {
                            uin: "0",
                            format: "json",
                            ct: 24,
                            cv: 0
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = `https://u.y.qq.com/cgi-bin/musicu.fcg?callback=${callbackName}&data=${encodeURIComponent(JSON.stringify(requestData))}`;
                    
                    script.onerror = () => {
                        clearTimeout(timeoutId);
                        delete window[callbackName];
                        resolve(null);
                    };
                    
                    document.head.appendChild(script);
                });
            }

                    // 使用musicu.fcg统一接口获取歌词
                    const requestData = {
                        comm: { ct: 24, cv: 0 },

                            method: "GetPlayLyricInfo",
                            param: {
                                songMID: songmid,
                                songID: 0
                            }
                        }
                    };
                    const url = `https://u.y.qq.com/cgi-bin/musicu.fcg?callback=${callbackName}&data=${encodeURIComponent(JSON.stringify(requestData))}`;
                    
                    const timeout = setTimeout(() => {
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        resolve([]); // 超时返回空数组，不reject
                    }, 5000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        
                        try {
                            if (data && data.lyric_0 && data.lyric_0.data) {
                                const lyricData = data.lyric_0.data;
                                const base64 = lyricData.lyric || '';
                                // 正确解码base64为UTF-8
                                const binaryStr = atob(base64);
                                const bytes = new Uint8Array(binaryStr.length);
                                for (let i = 0; i < binaryStr.length; i++) {
                                    bytes[i] = binaryStr.charCodeAt(i);
                                }
                                const lyric = new TextDecoder('utf-8').decode(bytes);
                                resolve(this.parseLRC(lyric));
                            } else {
                                resolve([]);
                            }
                        } catch (e) {
                            console.log('歌词解析失败:', e.message);
                            resolve([]);
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = url;
                    script.onerror = () => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        resolve([]); // 失败返回空数组
                    };
                    document.head.appendChild(script);
                });
            }

            // 从Meting API获取歌词
            async fetchLyricsFromMeting(songmid, source = 'qq') {
                try {
                    console.log(`尝试Meting API获取歌词: ${songmid}, 来源: ${source}`);
                    const servers = source === 'netease' ? ['netease', 'tencent'] : ['tencent', 'netease'];
                    
                    for (const server of servers) {
                        const resp = await fetch(`https://api.injahow.cn/meting/?server=${server}&type=lrc&id=${songmid}`, { 
                            signal: AbortSignal.timeout(10000) 
                        });
                        
                        if (resp.ok) {
                            const lrcText = await resp.text();
                            if (lrcText && lrcText.length > 10 && !lrcText.includes('"error"')) {
                                console.log(`Meting API获取歌词成功(${server}): ${songmid}`);
                                return this.parseLRC(lrcText);
                            }

                    }
                } catch (e) {
                    console.log(`Meting API获取歌词失败: ${e.message}`);
                }
                return [];
            }
            
            // 解析LRC格式歌词
            parseLRC(lrcText) {
                const lines = lrcText.split('\n');
                const result = [];
                
                for (const line of lines) {
                    const matches = line.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g);
                    if (!matches) continue;
                    
                    for (const match of matches) {
                        const parts = match.match(/\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/);
                        if (parts) {
                            const minutes = parseInt(parts[1]);
                            const seconds = parseInt(parts[2]);
                            const ms = parseInt(parts[3].padEnd(3, '0'));
                            const time = minutes * 60 + seconds + ms / 1000;
                            const text = parts[4].trim();
                            
                            if (text && !text.startsWith('[')) {
                                result.push({ time, text });
                            }
                        }
                    }
                }
                
                return result.sort((a, b) => a.time - b.time);
            }

            renderLyrics(lyrics) {

                this.elements.lyricsContent.innerHTML = html;
                
                // 添加歌词行点击事件
                this.elements.lyricsContent.querySelectorAll('.lyric-line').forEach(line => {
                    line.addEventListener('click', () => {

            // 更新当前歌词
            updateCurrentLyric() {
                if (!this.lyricsVisible) return;
                
                const currentTime = this.audio.currentTime;
                const lyricLines = this.elements.lyricsContent.querySelectorAll('.lyric-line');
                
                if (lyricLines.length === 0) return;
                
                let newIndex = -1;
                
                // 找到当前时间对应的歌词
                for (let i = lyricLines.length - 1; i >= 0; i--) {
                    const lineTime = parseFloat(lyricLines[i].dataset.time);
                    if (currentTime >= lineTime) {
                        newIndex = i;
                        break;
                    }
                }
                
                // 更新高亮
                if (newIndex !== this.currentLyricIndex) {
                    this.currentLyricIndex = newIndex;
                    
                    lyricLines.forEach((line, index) => {
                        line.classList.toggle('current', index === newIndex);
                        line.classList.toggle('past', index < newIndex);
                    });
                    
                    // 滚动到当前歌词
                    if (newIndex >= 0 && this.elements.lyricsScrollContainer) {
                        const currentLine = lyricLines[newIndex];
                        const container = this.elements.lyricsScrollContainer;
                        const containerHeight = container.clientHeight;
                        const lineTop = currentLine.offsetTop;
                        const lineHeight = currentLine.offsetHeight;
                        const scrollTop = lineTop - (containerHeight / 2) + (lineHeight / 2);
                        
                        container.scrollTo({
                            top: scrollTop,
                            behavior: 'smooth'
                        });
                    }
                }
            }

            async handleImportPlaylist() {

                if (!input) {
                    this.showError('请输入QQ音乐或网易云音乐歌单链接或ID');
                    return;
                }
                
                // 读取用户输入的歌单名，未填则自动生成

                // 判断是网易云还是QQ音乐
                const isNetease = /music\.163\.com|y\.music\.163\.com/i.test(input);
                
                // 解析歌单ID
                let playlistId = null;
                let sourceName = 'QQ音乐';
                
                if (isNetease) {
                    // 网易云音乐歌单ID解析
                    const idMatch = input.match(/[?&]id=(\d+)/);
                    if (idMatch) {
                        playlistId = idMatch[1];
                    } else {
                        // 尝试从路径中提取
                        const pathMatch = input.match(/playlist\/(\d+)/);
                        if (pathMatch) {
                            playlistId = pathMatch[1];
                        }
                    }
                    sourceName = '网易云音乐';
                } else {
                    // QQ音乐歌单ID解析
                    const idMatch = input.match(/[?&]id=(\d+)/);
                    const disstidMatch = input.match(/[?&]disstid=(\d+)/);
                    
                    if (idMatch) {
                        playlistId = idMatch[1];
                    } else if (disstidMatch) {
                        playlistId = disstidMatch[1];
                    } else {
                        const pathMatch = input.match(/playsquare\/(\d+)/);
                        if (pathMatch) {
                            playlistId = pathMatch[1];
                        } else {
                            const numMatch = input.match(/\b(\d{7,})\b/);
                            if (numMatch) {
                                playlistId = numMatch[1];
                            }
                        }
                    }
                }
                
                if (!playlistId) {
                    this.showError(`无法识别歌单ID，请输入${isNetease ? '网易云音乐' : 'QQ音乐'}歌单链接或数字ID`);
                    return;
                }
                
                this.showSuccess(`正在从${sourceName}导入歌单...`);
                
                try {
                    const result = isNetease 
                        ? await this.fetchPlaylistFromNetease(playlistId)
                        : await this.fetchPlaylistFromQQ(playlistId);
                    
                    if (result && result.songs && result.songs.length > 0) {
                        // 确定歌单名：用户输入 > 接口返回 > 首首歌名 + 等
                        let playlistName = userPlaylistName || result.name;
                        if (!playlistName || playlistName === '导入的歌单') {
                            const firstArtist = result.songs[0].artist;
                            playlistName = firstArtist ? `${firstArtist} 的歌单` : `${sourceName}歌单 ${playlistId}`;
                        }
                        
                        const newPlaylistId = 'imported_' + Date.now();
                        this.playlists[newPlaylistId] = {
                            name: playlistName,
                            songs: result.songs,
                            created: Date.now(),
                            imported: true,
                            source: isNetease ? 'netease' : 'qq'
                        };
                        
                        this.renderPlaylists();
                        this.saveState();
                        this.elements.importInput.value = '';
                        this.elements.importNameInput.value = '';
                        this.showSuccess(`歌单 "${playlistName}" 导入成功，共${result.songs.length}首`);
                    } else {
                        this.showError('未找到歌单歌曲，请检查ID是否正确');
                    }
                } catch (e) {
                    console.error('导入歌单失败:', e);
                    this.showError('导入失败: ' + e.message);
                }
            }

            // 获取网易云音乐歌单
            async fetchPlaylistFromNetease(playlistId) {
                // 策略1: Meting API（无需代理，支持CORS，任何域名可用）
                try {
                    const resp = await fetch(`https://api.injahow.cn/meting/?server=netease&type=playlist&id=${playlistId}`, { signal: AbortSignal.timeout(15000) });
                    if (resp.ok) {
                        const data = await resp.json();
                        if (Array.isArray(data) && data.length > 0) {
                            const songs = data.map(item => {
                                const urlMatch = item.url ? item.url.match(/id=([^&]+)/) : null;
                                const picMatch = item.pic ? item.pic.match(/id=([^&]+)/) : null;
                                const songmid = urlMatch ? urlMatch[1] : '';
                                const albummid = picMatch ? picMatch[1] : '';
                                
                                return {
                                    name: item.name || '未知歌曲',
                                    artist: item.artist || '未知歌手',
                                    album: '',
                                    songmid: songmid,
                                    albummid: albummid,
                                    coverUrl: item.pic || null, // 网易云直接提供完整图片URL
                                    duration: '',
                                    source: 'netease'
                                };
                            });
                            return { name: '导入的歌单', songs };
                        }
                    }
                } catch(e) { console.log('网易云Meting API失败:', e.message); }
                
                return null;
            }
            
            // 通过多种方式获取QQ音乐歌单
            async fetchPlaylistFromQQ(disstid) {
                // 策略1: Meting API（无需代理，支持CORS，任何域名可用）
                try {
                    const resp = await fetch(`https://api.injahow.cn/meting/?server=tencent&type=playlist&id=${disstid}`, { signal: AbortSignal.timeout(15000) });
                    if (resp.ok) {
                        const data = await resp.json();
                        if (Array.isArray(data) && data.length > 0) {
                            const songs = data.map(item => {
                                const urlMatch = item.url ? item.url.match(/id=([^&]+)/) : null;
                                const picMatch = item.pic ? item.pic.match(/id=([^&]+)/) : null;
                                const songmid = urlMatch ? urlMatch[1] : '';
                                const albummid = picMatch ? picMatch[1] : '';
                                
                                return {
                                    name: item.name || '未知歌曲',
                                    artist: item.artist || '未知歌手',
                                    album: '',
                                    songmid: songmid,
                                    albummid: albummid,
                                    coverUrl: albummid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${albummid}.jpg` : null,
                                    duration: '',
                                    source: 'qq'
                                };
                            });
                            return { name: '导入的歌单', songs };
                        }
                    }
                } catch(e) { console.log('Meting API失败:', e.message); }
                
                // 策略2: 自定义代理（备用）
                const proxyUrl = this.getProxyUrl();
                if (proxyUrl) {
                    try {
                        const resp = await fetch(`${proxyUrl}/api/playlist?id=${disstid}`, { signal: AbortSignal.timeout(15000) });
                        if (resp.ok) {
                            const data = await resp.json();
                            const result = this._parsePlaylistData(data);
                            if (result) return result;
                        }
                    } catch(e) { console.log('自定义代理失败:', e.message); }
                }
                
                // 策略3: JSONP直连 (仅在y.qq.com域名下有效)
                try {
                    const result = await this._fetchPlaylistJSONP(disstid);
                    if (result) return result;
                } catch(e) { console.log('JSONP策略失败:', e.message); }
                
                return null;
            }
            
            // JSONP方式获取歌单
            _fetchPlaylistJSONP(disstid) {
                return new Promise((resolve, reject) => {
                    const callbackName = 'PlCb' + Date.now() + Math.floor(Math.random() * 1000);
                    const url = `https://c.y.qq.com/qzone/fcg-bin/fcg_ucc_getcdinfo_byids_cp.fcg?type=1&json=1&utf8=1&onlysong=0&nosign=1&new_format=1&disstid=${disstid}&g_tk=5381&loginUin=0&hostUin=0&format=json&inCharset=GB2312&outCharset=utf-8&notice=0&platform=yqq&needNewCode=0&jsonpCallback=${callbackName}`;
                    
                    const timeout = setTimeout(() => {
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        reject(new Error('请求超时'));
                    }, 10000);
                    
                    window[callbackName] = (data) => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        
                        const result = this._parsePlaylistData(data);
                        if (result) {
                            resolve(result);
                        } else {
                            reject(new Error(data.msg || '未找到歌单'));
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = url;
                    script.onerror = () => {
                        clearTimeout(timeout);
                        delete window[callbackName];
                        if (script.parentNode) script.remove();
                        reject(new Error('网络请求失败'));
                    };
                    document.head.appendChild(script);
                });
            }
            
            // 解析歌单数据 (兼容新旧两种格式)
            _parsePlaylistData(data) {
                if (!data) return null;
                
                const cdlist = data.cdlist || (data.data && data.data.cdlist);
                if (!cdlist || cdlist.length === 0) return null;
                
                const cd = cdlist[0];
                const songs = (cd.songlist || []).map(s => {
                    // 兼容 new_format 和旧格式
                    const songmid = s.mid || s.songmid;
                    const albummid = (s.album && s.album.mid) || s.albummid || '';
                    const songname = s.name || s.songname;
                    const albumname = (s.album && s.album.name) || s.albumname || '';
                    const singer = s.singer || [];
                    const interval = s.interval || 0;
                    
                    return {
                        name: songname,
                        artist: singer.map(a => a.name || a.title).join(' / '),
                        album: albumname,
                        songmid: songmid,
                        albummid: albummid,
                        coverUrl: albummid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${albummid}.jpg` : null,
                        duration: interval ? `${Math.floor(interval/60).toString().padStart(2,'0')}:${(interval%60).toString().padStart(2,'0')}` : ''
                    };
                });
                
                if (songs.length === 0) return null;
                
                return {
                    name: cd.dissname || '导入的歌单',
                    songs
                };
            }
            
            // 切换播放/暂停
            togglePlay() {
                if (this.currentSongIndex === -1) return;
                
                if (this.isPlaying) {
                    this.audio.pause();
                } else {
                    this.audio.play();
                }
            }
            
            // 播放上一首
            playPrev() {
                let songs;
                
                if (this.currentPlaylist === 'home') {
                    songs = presetSongs;
                } else if (this.currentPlaylist === 'search') {
                    songs = this.searchResults;
                } else if (this.currentPlaylist.startsWith('playlist:')) {
                    const playlistId = this.currentPlaylist.split(':')[1];
                    songs = this.playlists[playlistId]?.songs || [];
                } else {
                    songs = presetSongs;
                }
                
                if (songs.length === 0) return;
                
                let newIndex = this.currentSongIndex - 1;
                if (newIndex < 0) newIndex = songs.length - 1;
                
                this.playSong(newIndex, this.currentPlaylist);
            }
            
            // 播放下一首
            playNext() {
                let songs;
                
                if (this.currentPlaylist === 'home') {
                    songs = presetSongs;
                } else if (this.currentPlaylist === 'search') {
                    songs = this.searchResults;
                } else if (this.currentPlaylist.startsWith('playlist:')) {
                    const playlistId = this.currentPlaylist.split(':')[1];
                    songs = this.playlists[playlistId]?.songs || [];
                } else {
                    songs = presetSongs;
                }
                
                if (songs.length === 0) return;
                
                let newIndex = this.currentSongIndex + 1;
                if (newIndex >= songs.length) newIndex = 0;
                
                this.playSong(newIndex, this.currentPlaylist);
            }

            updatePlayerUI(song) {
                this.elements.miniTitle.textContent = song.name;
                this.elements.miniArtist.textContent = song.artist;
                this.elements.fullTitle.textContent = song.name;
                this.elements.fullArtist.textContent = song.artist;

                this.updateCoverImage(song.coverUrl);
            }

                if (coverUrl) {

            }
            
            // 更新播放按钮状态
            updatePlayButton() {
                const playSvg = '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>';
                const pauseSvg = '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>';

            // 高亮当前播放歌曲
            highlightCurrentSong() {
                const songItems = document.querySelectorAll('.song-item');
                songItems.forEach((item) => {
                    item.classList.remove('active');
                });
                
                // 根据当前播放列表和索引高亮
                const currentItems = document.querySelectorAll(`.song-item[data-source="${this.currentPlaylist}"]`);
                if (currentItems[this.currentSongIndex]) {
                    currentItems[this.currentSongIndex].classList.add('active');
                    
                    // 滚动到当前歌曲
                    currentItems[this.currentSongIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
            
            // 更新进度条
            updateProgress() {
                if (this.isDraggingProgress || !this.audio.duration) return;
                
                const progress = (this.audio.currentTime / this.audio.duration) * 100;
                this.elements.progressCurrent.style.width = `${progress}%`;
                this.elements.progressHandle.style.left = `${progress}%`;
                this.elements.currentTime.textContent = this.formatTime(this.audio.currentTime);
                this.elements.totalTime.textContent = this.formatTime(this.audio.duration);
                
                // 更新歌词
                this.updateCurrentLyric();
            }
            
            // 进度条交互处理
            handleProgressMouseDown(e) {
                this.isDraggingProgress = true;
                this.updateProgressFromEvent(e);
            }
            
            handleProgressTouchStart(e) {
                e.preventDefault();
                this.isDraggingProgress = true;
                this.updateProgressFromEvent(e.touches[0]);
            }
            
            handleProgressMouseMove(e) {
                if (this.isDraggingProgress) {
                    this.updateProgressFromEvent(e);
                }
            }
            
            handleProgressTouchMove(e) {
                if (this.isDraggingProgress) {
                    e.preventDefault();
                    this.updateProgressFromEvent(e.touches[0]);
                }
            }
            
            handleProgressMouseUp() {
                this.isDraggingProgress = false;
            }
            
            handleProgressTouchEnd() {
                this.isDraggingProgress = false;
            }
            
            // 根据事件位置更新进度
            updateProgressFromEvent(e) {
                const progressBar = this.elements.progressBar;
                const rect = progressBar.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const progress = Math.max(0, Math.min(100, (x / rect.width) * 100));
                
                this.elements.progressCurrent.style.width = `${progress}%`;
                this.elements.progressHandle.style.left = `${progress}%`;
                
                // 更新音频时间
                if (this.audio.duration) {
                    this.audio.currentTime = (progress / 100) * this.audio.duration;
                }
            }
            
            // 音量控制
            handleVolumeChange() {
                const volume = this.elements.volumeSlider.value / 100;
                this.audio.volume = volume;
            }
            
            // 显示全屏播放器
            showFullPlayer() {
                if (this.currentSongIndex === -1) return;
                this.elements.fullPlayer.classList.add('active');
            }
            
            // 隐藏全屏播放器
            hideFullPlayer() {
                this.elements.fullPlayer.classList.remove('active');
            }

            handleAudioError() {
                this.showError('音频播放失败，可能是网络问题或音频格式不支持');
                this.isPlaying = false;
                this.updatePlayButton();
            }

                this.elements.errorToast.classList.add('show');
                
                setTimeout(() => {
                    this.elements.errorToast.classList.remove('show');
                }, 3000);
            }

            showSuccess(message) {
                this.elements.errorToast.textContent = message;
                this.elements.errorToast.style.background = 'rgba(0, 245, 212, 0.9)';
                this.elements.errorToast.classList.add('show');
                
                setTimeout(() => {
                    this.elements.errorToast.classList.remove('show');
                }, 3000);
            }
            
            // 显示模态框
            showModal(title, placeholder, callback) {
                this.elements.modalTitle.textContent = title;
                this.elements.modalInput.placeholder = placeholder;
                this.elements.modalInput.value = '';
                this.elements.modalOverlay.classList.add('active');
                
                // 设置确认按钮事件

                setTimeout(() => {

            hideModal() {
                this.elements.modalOverlay.classList.remove('active');
            }
            
            // 保存播放状态
            saveState() {
                try {
                    const state = {
                    currentSongIndex: this.currentSongIndex,
                    currentPlaylist: this.currentPlaylist,
                        volume: this.audio.volume,
                        playlists: this.playlists,
                        playHistory: this.playHistory,
                    qqUser: this.qqUser
                };
                    localStorage.setItem('ciyuanMusicState', JSON.stringify(state));
                } catch (error) {
                    console.warn('无法保存播放状态:', error);
                }
            }
            
            // 加载播放状态
            loadState() {
                try {
                    const savedState = localStorage.getItem('ciyuanMusicState');
                    if (savedState) {
                        const state = JSON.parse(savedState);
                        
                        // 恢复歌单
                        if (state.playlists) {
                            this.playlists = state.playlists;
                        }
                        
                        // 恢复播放历史
                        if (state.playHistory) {
                            this.playHistory = state.playHistory;
                        }
                        
                        if (state.qqUser) {
                            this.qqUser = state.qqUser;
                        }
                        
                        // 恢复音量
                        if (state.volume !== undefined) {
                            this.audio.volume = state.volume;
                            this.elements.volumeSlider.value = state.volume * 100;
                        }
                    }
                } catch (error) {
                    console.warn('无法加载播放状态:', error);
                }
            }
            
            // 工具函数：格式化时间（秒 -> mm:ss）
            formatTime(seconds) {
                if (isNaN(seconds)) return '00:00';
                
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            // 工具函数：获取来源标签HTML
            getSourceBadgeHTML(song) {
                if (!song) return '';
                const src = song.source;
                if (!src) return '';
                
                if (Array.isArray(src)) {
                    return `<span class="source-badges">${src.map(s => {
                        if (s === 'qq') return `<span class="source-badge source-badge-qq" title="QQ音乐"><img loading="lazy" src="${this._qqIconBase64()}" style="width:14px;height:14px;border-radius:50%;" /></span>`;
                        if (s === 'netease') return `<span class="source-badge source-badge-netease" title="网易云音乐"><img loading="lazy" src="${this._neteaseIconBase64()}" style="width:14px;height:14px;border-radius:50%;" /></span>`;
                        return '';
                    }).join('')}</span>`;
                }
                
                if (src === 'qq') return `<span class="source-badge source-badge-qq" title="QQ音乐"><img loading="lazy" src="${this._qqIconBase64()}" style="width:14px;height:14px;border-radius:50%;" /></span>`;
                if (src === 'netease') return `<span class="source-badge source-badge-netease" title="网易云音乐"><img loading="lazy" src="${this._neteaseIconBase64()}" style="width:14px;height:14px;border-radius:50%;" /></span>`;
                return '';
            }
            
            // 工具函数：获取歌单来源标签HTML
            getPlaylistSourceBadgeHTML(playlist) {
                if (!playlist) return '';
                const src = playlist.source;
                if (!src || src === 'local') return '';
                
                if (src === 'qq') return `<span class="source-badge source-badge-lg source-badge-qq" title="QQ音乐歌单"><img loading="lazy" src="${this._qqIconBase64()}" style="width:18px;height:18px;border-radius:50%;" /></span>`;
                if (src === 'netease') return `<span class="source-badge source-badge-lg source-badge-netease" title="网易云音乐歌单"><img loading="lazy" src="${this._neteaseIconBase64()}" style="width:18px;height:18px;border-radius:50%;" /></span>`;
                return '';
            }
        }
        
        // 初始化播放器
        let musicPlayer;
        document.addEventListener('DOMContentLoaded', () => {
            musicPlayer = new CiyuanMusicPlayer();
            window.musicPlayer = musicPlayer; // 便于调试
        });
    </script>
</body>
</html>
