<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>次元音乐</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        /* 基础样式与CSS变量 - 赛博星空主题 */
        :root {
            --bg-primary: #1a0a2e;
            --bg-secondary: #0d1b2a;
            --bg-gradient: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, #0a0e1a 100%);
            --accent-primary: #ff006e;
            --accent-secondary: #8338ec;
            --accent-tertiary: #3a86ff;
            --accent-neon: #00f5d4;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-tertiary: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(20px);
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-strong: 0 10px 40px rgba(0, 0, 0, 0.5);
            --neon-glow: 0 0 10px rgba(255, 0, 110, 0.5), 0 0 20px rgba(255, 0, 110, 0.3);
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s ease;
            --border-radius-sm: 8px;
            --border-radius-md: 12px;
            --border-radius-lg: 20px;
            --border-radius-xl: 24px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --tab-height: 60px;
            --player-bar-height: 70px;
        }
        
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        html {
            height: 100%;
            overflow: hidden;
        }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        
        /* 应用容器 - 使用viewport单位确保完整覆盖 */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        
        /* 星空背景动画 */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(2px 2px at 20px 30px, #eee, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(2px 2px at 50px 160px, #ddd, transparent),
                radial-gradient(2px 2px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 120px, #ddd, transparent);
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 5s ease-in-out infinite alternate;
        }
        
        @keyframes twinkle {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        
        /* 顶部标题栏 */
        .header {
            background: rgba(26, 10, 46, 0.8);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            padding: 15px 20px;
            flex-shrink: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .app-title {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: var(--neon-glow);
        }
        
        .header-search-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all var(--transition-fast);
        }
        
        .header-search-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* 主内容区域 - 动态计算底部空间 */
        .main-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-bottom: calc(var(--player-bar-height) + var(--tab-height) + 20px);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
        }
        
        .main-content::-webkit-scrollbar {
            width: 4px;
        }
        
        .main-content::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .main-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
        
        /* 页面切换 */
        .page {
            display: none;
            padding: 15px;
            min-height: 100%;
        }
        
        .page.active {
            display: block;
        }
        
        /* 首页样式 */
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 15px;
            color: var(--accent-neon);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--accent-primary);
            border-radius: 2px;
        }
        
        .recommend-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .recommend-card {
            background: var(--glass-bg);
            border-radius: var(--border-radius-md);
            overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: all var(--transition-normal);
            cursor: pointer;
        }
        
        .recommend-card:active {
            transform: scale(0.95);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.3);
        }
        
        .card-cover {
            width: 100%;
            padding-bottom: 100%;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .card-cover img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .card-play-icon {
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            background: rgba(255, 0, 110, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            box-shadow: var(--neon-glow);
        }
        
        .card-info {
            padding: 8px;
        }
        
        .card-title {
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        
        .card-artist {
            font-size: 10px;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* 歌曲列表样式 */
        .song-list {
            margin-bottom: 20px;
        }
        
        .song-item {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .song-item:active {
            background: rgba(255, 255, 255, 0.03);
        }
        
        .song-item.active {
            background: rgba(255, 0, 110, 0.1);
            border-radius: var(--border-radius-sm);
            padding: 12px 10px;
            margin: 0 -10px;
        }
        
        .song-index {
            width: 25px;
            color: var(--text-tertiary);
            font-size: 14px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .song-item.active .song-index {
            color: var(--accent-primary);
        }
        
        .song-cover {
            width: 48px;
            height: 48px;
            border-radius: var(--border-radius-sm);
            margin-right: 12px;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            position: relative;
            overflow: hidden;
        }
        
        .song-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .song-info {
            flex: 1;
            min-width: 0;
        }
        
        .song-name {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 3px;
        }
        
        .song-item.active .song-name {
            color: var(--accent-primary);
        }
        
        .song-artist {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .song-duration {
            color: var(--text-tertiary);
            font-size: 13px;
            flex-shrink: 0;
            margin-left: 10px;
        }
        
        /* 添加到歌单按钮 */
        .add-to-playlist-btn {
            width: 28px;
            height: 28px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--accent-neon);
            border-radius: 50%;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: all var(--transition-fast);
        }
        
        .add-to-playlist-btn:active {
            transform: scale(0.9);
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }
        
        /* 从歌单移除按钮 */
        .remove-from-playlist-btn {
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 68, 68, 0.3);
            background: transparent;
            color: #ff4444;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 8px;
            transition: all var(--transition-fast);
        }
        
        .remove-from-playlist-btn:active {
            transform: scale(0.9);
            background: #ff4444;
            color: white;
        }
        
        /* 歌单详情返回按钮 */
        .back-to-list-btn {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: var(--border-radius-xl);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
        }
        
        .back-to-list-btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* 歌单选择弹窗 */
        .playlist-select-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            transition: background var(--transition-fast);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        
        .playlist-select-item:active {
            background: rgba(255, 0, 110, 0.1);
        }
        
        .playlist-select-name {
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .playlist-select-count {
            font-size: 12px;
            color: var(--text-tertiary);
        }
        
        .playlist-select-new {
            color: var(--accent-neon);
            margin-top: 8px;
            border-bottom: none;
        }
        
        .modal-body {
            padding: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        
        /* 歌单页面 */
        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .create-playlist-btn {
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--border-radius-xl);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition-fast);
            box-shadow: var(--neon-glow);
        }
        
        .create-playlist-btn:active {
            transform: scale(0.95);
        }
        
        .playlist-card {
            background: var(--glass-bg);
            border-radius: var(--border-radius-md);
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .playlist-card:active {
            transform: scale(0.98);
            border-color: var(--accent-primary);
        }
        
        .playlist-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }
        
        .playlist-count {
            font-size: 13px;
            color: var(--text-tertiary);
        }
        
        .playlist-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border: none;
            padding: 6px 12px;
            border-radius: var(--border-radius-sm);
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .action-btn:active {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .delete-btn {
            color: var(--accent-primary);
        }
        
        /* 搜索页面 */
        .search-container {
            display: flex;
            align-items: center;
            background: var(--glass-bg);
            border-radius: var(--border-radius-xl);
            padding: 12px 15px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
            transition: all var(--transition-normal);
        }
        
        .search-container:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(255, 0, 110, 0.3);
        }
        
        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
            min-width: 0;
            caret-color: var(--accent-primary);
        }
        
        .search-input::placeholder {
            color: var(--text-tertiary);
        }
        
        .search-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform var(--transition-fast);
        }
        
        .search-btn:active {
            transform: scale(0.9);
        }
        
        /* 底部导航栏 */
        .bottom-tab {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(26, 10, 46, 0.95);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: var(--tab-height);
            z-index: 50;
            /* 使用 padding 安全区域 */
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            height: 100%;
            color: var(--text-tertiary);
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            transition: all var(--transition-fast);
            position: relative;
        }
        
        .tab-item.active {
            color: var(--accent-primary);
        }
        
        .tab-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: var(--accent-primary);
            border-radius: 0 0 3px 3px;
            box-shadow: var(--neon-glow);
        }
        
        .tab-icon {
            font-size: 22px;
            margin-bottom: 3px;
        }
        
        /* 迷你播放器 */
        .mini-player {
            position: fixed;
            bottom: calc(var(--tab-height) + env(safe-area-inset-bottom, 0px));
            left: 0;
            right: 0;
            background: rgba(13, 27, 42, 0.95);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-top: 1px solid var(--glass-border);
            padding: 8px 15px;
            display: flex;
            align-items: center;
            z-index: 40;
            height: var(--player-bar-height);
            will-change: transform;
        }
        
        .mini-player-info {
            flex: 1;
            display: flex;
            align-items: center;
            min-width: 0;
        }
        
        .mini-cover {
            width: 50px;
            height: 50px;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            margin-right: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
        }
        
        .mini-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .mini-text {
            flex: 1;
            min-width: 0;
        }
        
        .mini-title {
            font-size: 15px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }
        
        .mini-artist {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .mini-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 22px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
        }
        
        .control-btn:active {
            transform: scale(0.85);
            color: var(--accent-primary);
        }
        
        .play-btn {
            font-size: 26px;
            color: var(--accent-primary);
            position: relative;
        }
        
        /* 全屏播放器 */
        .full-player {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--bg-gradient);
            z-index: 200;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform var(--transition-slow);
            overflow: hidden;
        }
        
        .full-player.active {
            transform: translateY(0);
        }
        
        .full-player::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 30%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 70% 70%, rgba(131, 56, 236, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .full-player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            z-index: 10;
        }
        
        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
        }
        
        .back-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.2);
            color: var(--accent-primary);
        }
        
        .player-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .full-player-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px 20px;
            position: relative;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }
        
        .full-cover-container {
            flex-shrink: 0;
            margin-bottom: 10px;
        }
        
        .full-controls-container {
            width: 100%;
            flex-shrink: 0;
        }
        
        .full-cover {
            width: 200px;
            height: 200px;
            border-radius: var(--border-radius-lg);
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-tertiary));
            margin-bottom: 20px;
            box-shadow: var(--shadow-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 60px;
            position: relative;
            overflow: hidden;
            transform: perspective(1000px) rotateY(0deg);
            transition: transform var(--transition-slow);
        }
        
        .full-cover.playing {
            transform: perspective(1000px) rotateY(10deg);
            animation: pulse 3s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: var(--shadow-strong); }
            50% { box-shadow: 0 15px 50px rgba(255, 0, 110, 0.4); }
        }

        .error-toast {

            top: 20px;
            left: 50%;

            transform: translateX(-50%) translateY(0);

        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;

            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;

        @keyframes spin {

        /* 空状态 */

            padding: 40px 20px;

        .empty-state .icon {

        /* 响应式调整 */

            .full-artist {

        /* 底部安全区域 - 使用更可靠的方案 */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {

            }

</head>

        // 音乐播放器主类
        class CiyuanMusicPlayer {
            constructor() {
                // 状态变量
                this.currentSongIndex = -1;
                this.isPlaying = false;
                this.isDraggingProgress = false;
                this.searchResults = [];
                this.currentPlaylist = 'home';
                this.playlists = {};
                this.playHistory = [];
                this.currentLyricIndex = -1;
                this.lyricsVisible = false;
                this.currentQuality = '320'; // 默认高品音质
                
                this.audio = new Audio();
                this.searchTimer = null;
                
                // 初始化
                this.initElements();
                this.initEventListeners();
                this.initAudioEvents();
                this.loadState();
                this.renderHomePage();
                this.renderPlaylists();
                
                // 默认音量
                this.audio.volume = 0.8;
            }
            
            // 初始化UI元素引用
            initElements() {
                this.elements = {
                    // 页面
                    homePage: document.getElementById('homePage'),
                    playlistPage: document.getElementById('playlistPage'),
                    searchPage: document.getElementById('searchPage'),
                    profilePage: document.getElementById('profilePage'),

                    createPlaylistBtn: document.getElementById('createPlaylistBtn'),

                    searchBtn: document.getElementById('searchBtn'),
                    searchResults: document.getElementById('searchResults'),
                    searchLoading: document.getElementById('searchLoading'),
                    searchEmpty: document.getElementById('searchEmpty'),
                    
                    // 我的页面
                    historyList: document.getElementById('historyList'),
                    importInput: document.getElementById('importInput'),
                    importNameInput: document.getElementById('importNameInput'),
                    importBtn: document.getElementById('importBtn'),
                    
                    // 播放器
                    miniPlayer: document.getElementById('miniPlayer'),
                    miniTitle: document.getElementById('miniTitle'),
                    miniArtist: document.getElementById('miniArtist'),
                    miniCover: document.getElementById('miniCover'),
                    playBtn: document.getElementById('playBtn'),
                    prevBtn: document.getElementById('prevBtn'),
                    nextBtn: document.getElementById('nextBtn'),
                    
                    // 全屏播放器
                    fullPlayer: document.getElementById('fullPlayer'),
                    backBtn: document.getElementById('backBtn'),
                    fullTitle: document.getElementById('fullTitle'),
                    fullArtist: document.getElementById('fullArtist'),
                    fullCover: document.getElementById('fullCover'),
                    progressBar: document.getElementById('progressBar'),
                    progressCurrent: document.getElementById('progressCurrent'),
                    progressHandle: document.getElementById('progressHandle'),
                    currentTime: document.getElementById('currentTime'),
                    totalTime: document.getElementById('totalTime'),
                    fullPlayBtn: document.getElementById('fullPlayBtn'),
                    fullPrevBtn: document.getElementById('fullPrevBtn'),
                    fullNextBtn: document.getElementById('fullNextBtn'),
                    volumeSlider: document.getElementById('volumeSlider'),
                    qualityButtons: document.querySelectorAll('.quality-btn'),
                    
                    // 歌词
                    lyricsContainer: document.getElementById('lyricsContainer'),
                    lyricsToggle: document.getElementById('lyricsToggle'),
                    lyricsCloseBtn: document.getElementById('lyricsCloseBtn'),
                    lyricsScrollContainer: document.getElementById('lyricsScrollContainer'),
                    lyricsContent: document.getElementById('lyricsContent'),
                    
                    // 模态框
                    modalOverlay: document.getElementById('modalOverlay'),
                    modalTitle: document.getElementById('modalTitle'),
                    modalInput: document.getElementById('modalInput'),
                    modalCancel: document.getElementById('modalCancel'),
                    modalConfirm: document.getElementById('modalConfirm'),
                    
                    // 其他
                    errorToast: document.getElementById('errorToast'),
                    searchPageBtn: document.getElementById('searchPageBtn')
                };
            }
            
            // 初始化事件监听器
            initEventListeners() {
                // 底部导航
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.addEventListener('click', () => {
                        this.switchTab(tab.dataset.tab);
                    });
                });
                
                // 搜索相关事件
                this.elements.searchInput.addEventListener('input', this.handleSearchInput.bind(this));
                this.elements.searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.handleSearch();
                });
                this.elements.searchBtn.addEventListener('click', this.handleSearch.bind(this));
                this.elements.searchPageBtn.addEventListener('click', () => {
                    this.switchTab('search');
                });
                
                // 播放控制事件
                this.elements.playBtn.addEventListener('click', this.togglePlay.bind(this));
                this.elements.prevBtn.addEventListener('click', this.playPrev.bind(this));
                this.elements.nextBtn.addEventListener('click', this.playNext.bind(this));
                
                // 全屏播放器事件
                this.elements.miniPlayer.addEventListener('click', this.showFullPlayer.bind(this));
                this.elements.backBtn.addEventListener('click', this.hideFullPlayer.bind(this));
                this.elements.fullPlayBtn.addEventListener('click', this.togglePlay.bind(this));
                this.elements.fullPrevBtn.addEventListener('click', this.playPrev.bind(this));
                this.elements.fullNextBtn.addEventListener('click', this.playNext.bind(this));
                this.elements.lyricsToggle.addEventListener('click', this.toggleLyrics.bind(this));
                this.elements.lyricsCloseBtn.addEventListener('click', this.hideLyrics.bind(this));
                
                // 进度条事件
                this.elements.progressBar.addEventListener('mousedown', this.handleProgressMouseDown.bind(this));
                this.elements.progressBar.addEventListener('touchstart', this.handleProgressTouchStart.bind(this), { passive: false });
                document.addEventListener('mousemove', this.handleProgressMouseMove.bind(this));
                document.addEventListener('mouseup', this.handleProgressMouseUp.bind(this));
                document.addEventListener('touchmove', this.handleProgressTouchMove.bind(this), { passive: false });
                document.addEventListener('touchend', this.handleProgressTouchEnd.bind(this));
                
                // 音量控制事件
                this.elements.volumeSlider.addEventListener('input', this.handleVolumeChange.bind(this));
                
                // 音质选择事件
                this.elements.qualityButtons.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.elements.qualityButtons.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.currentQuality = btn.dataset.quality;
                        this.showSuccess(`已切换到${btn.textContent}音质`);
                    });
                });
                
                // 歌单创建
                this.elements.createPlaylistBtn.addEventListener('click', () => {
                    this.showModal('创建歌单', '请输入歌单名称', (name) => {
                        this.createPlaylist(name);
                    });
                });
                
                // 导入歌单
                this.elements.importBtn.addEventListener('click', this.handleImportPlaylist.bind(this));
                
                // 模态框
                this.elements.modalCancel.addEventListener('click', this.hideModal.bind(this));
                this.elements.modalOverlay.addEventListener('click', (e) => {
                    if (e.target === this.elements.modalOverlay) {
                        this.hideModal();
                    }
                });
                
                // 点击歌曲列表项
                document.addEventListener('click', (e) => {
                    const songItem = e.target.closest('.song-item');
                    if (songItem) {
                        const index = parseInt(songItem.dataset.index);
                        const source = songItem.dataset.source || 'home';
                        this.playSong(index, source);
                    }
                });
                
                // 首页推荐卡片点击
                document.addEventListener('click', (e) => {
                    const recommendCard = e.target.closest('.recommend-card');
                    if (recommendCard) {
                        const songId = parseInt(recommendCard.dataset.songId);
                        const song = presetSongs.find(s => s.id === songId);
                        if (song) {
                            const index = presetSongs.indexOf(song);
                            this.playSong(index, 'home');
                        }
                    }
                });
            }
            
            // 初始化音频事件
            initAudioEvents() {
                this.audio.addEventListener('timeupdate', this.updateProgress.bind(this));
                this.audio.addEventListener('ended', this.playNext.bind(this));
                this.audio.addEventListener('error', this.handleAudioError.bind(this));
                this.audio.addEventListener('play', () => {
                    this.isPlaying = true;
                    this.updatePlayButton();
                    this.elements.fullCover.classList.add('playing');
                });
                this.audio.addEventListener('pause', () => {
                    this.isPlaying = false;
                    this.updatePlayButton();
                    this.elements.fullCover.classList.remove('playing');
                });
            }
            
            // 切换标签页
            switchTab(tabName) {
                // 更新标签状态
                document.querySelectorAll('.tab-item').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.tab === tabName);
                });
                
                // 更新页面显示
                document.querySelectorAll('.page').forEach(page => {
                    page.classList.remove('active');
                });
                
                const pageMap = {
                    'home': 'homePage',
                    'playlist': 'playlistPage',
                    'search': 'searchPage',
                    'profile': 'profilePage'
                };
                
                if (pageMap[tabName]) {
                    document.getElementById(pageMap[tabName]).classList.add('active');
                }
                
                // 聚焦搜索框
                if (tabName === 'search') {
                    setTimeout(() => {
                        this.elements.searchInput.focus();
                    }, 300);
                }
            }
            
            // 渲染首页
            renderHomePage() {
                // 渲染推荐网格
                let gridHtml = '';
                const recommendSongs = presetSongs.slice(0, 4);
                
                recommendSongs.forEach(song => {
                    gridHtml += `
                        <div class="recommend-card" data-song-id="${song.id}">
                            <div class="card-cover">
                                <img src="${song.coverUrl}" alt="${this.escapeHtml(song.name)}" 
                                     onerror="this.src='${defaultCover}'; this.onerror=null;">
                                <div class="card-play-icon">▶</div>
                            </div>
                            <div class="card-info">
                                <div class="card-title">${this.escapeHtml(song.name)}</div>
                                <div class="card-artist">${this.escapeHtml(song.artist)}</div>
                            </div>
                        </div>
                    `;
                });
                
                this.elements.recommendGrid.innerHTML = gridHtml;
                
                // 渲染歌曲列表
                let listHtml = '';
                presetSongs.forEach((song, index) => {
                    listHtml += `
                        <div class="song-item" data-index="${index}" data-source="home">
                            <span class="song-index">${index + 1}</span>
                            <div class="song-cover">
                                <img src="${song.coverUrl}" alt="${this.escapeHtml(song.name)}" 
                                     onerror="this.src='${defaultCover}'; this.onerror=null;">
                            </div>
                            <div class="song-info">
                                <div class="song-name">${this.escapeHtml(song.name)}</div>
                                <div class="song-artist">${this.escapeHtml(song.artist)}</div>
                            </div>
                            <span class="song-duration">${song.duration}</span>
                        </div>
                    `;
                });
                
                this.elements.homeSongList.innerHTML = listHtml;
            }
            
            // 渲染歌单列表
            renderPlaylists() {
                let html = '';
                
                if (Object.keys(this.playlists).length === 0) {
                    html = `
                        <div class="empty-state">
                            <span class="icon">📂</span>
                            <p>还没有创建歌单</p>
                        </div>
                    `;
                } else {
                    for (const [id, playlist] of Object.entries(this.playlists)) {
                        html += `
                            <div class="playlist-card" data-playlist-id="${id}">
                                <div class="playlist-title">${this.escapeHtml(playlist.name)}</div>
                                <div class="playlist-count">${playlist.songs.length} 首歌曲</div>
                                <div class="playlist-actions">
                                    <button class="action-btn" onclick="musicPlayer.editPlaylist('${id}')">编辑</button>
                                    <button class="action-btn delete-btn" onclick="musicPlayer.deletePlaylist('${id}')">删除</button>
                                </div>
                            </div>
                        `;
                    }
                }
                
                this.elements.playlistList.innerHTML = html;
                
                // 添加歌单卡片点击事件
                document.querySelectorAll('.playlist-card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (!e.target.closest('.action-btn')) {
                            const playlistId = card.dataset.playlistId;
                            this.showPlaylistDetail(playlistId);
                        }
                    });
                });
            }
            
            // 显示歌单详情
            showPlaylistDetail(playlistId) {
                const playlist = this.playlists[playlistId];
                if (!playlist) return;
                
                // 切换到歌单页面并显示详情
                this.switchTab('playlist');
                
                let html = `
                    <div style="margin-bottom: 20px;">
                        <button class="back-to-list-btn" onclick="musicPlayer.backToPlaylistList()">
                            ← 返回歌单列表
                        </button>
                        <h3 style="font-size: 20px; margin-bottom: 5px;">${this.escapeHtml(playlist.name)}</h3>
                        <p style="color: var(--text-tertiary); font-size: 14px;">${playlist.songs.length} 首歌曲</p>
                        <button class="create-playlist-btn" onclick="musicPlayer.addSongToPlaylistModal('${playlistId}')" style="margin-top: 15px;">
                            + 添加歌曲
                        </button>
                    </div>
                `;
                
                if (playlist.songs.length === 0) {
                    html += `
                        <div class="empty-state">
                            <span class="icon">🎵</span>
                            <p>歌单中还没有歌曲</p>
                        </div>
                    `;
                } else {
                    html += '<div class="song-list">';
                    playlist.songs.forEach((song, index) => {
                        html += `
                            <div class="song-item" data-index="${index}" data-source="playlist:${playlistId}">
                                <span class="song-index">${index + 1}</span>
                                <div class="song-cover">
                                    <img src="${song.coverUrl}" alt="${this.escapeHtml(song.name)}" 
                                         onerror="this.style.display='none';">
                                </div>
                                <div class="song-info">
                                    <div class="song-name">${this.escapeHtml(song.name)}</div>
                                    <div class="song-artist">${this.escapeHtml(song.artist)}</div>
                                </div>
                                <button class="remove-from-playlist-btn" onclick="event.stopPropagation(); musicPlayer.removeFromPlaylist('${playlistId}', ${index})" title="从歌单移除">✕</button>
                                <span class="song-duration">${song.duration}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                this.elements.playlistList.innerHTML = html;
            }
            
            // 从歌单中移除歌曲
            backToPlaylistList() {
                this.switchTab('playlist');
                this.renderPlaylists();
            }
            
            removeFromPlaylist(playlistId, index) {
                const playlist = this.playlists[playlistId];
                if (!playlist || index < 0 || index >= playlist.songs.length) return;
                
                const songName = playlist.songs[index].name;
                playlist.songs.splice(index, 1);
                this.saveState();
                this.showPlaylistDetail(playlistId);
                this.showSuccess(`已从歌单移除 "${songName}"`);
            }
            
            // 添加歌曲到歌单模态框
            addSongToPlaylistModal(playlistId) {
                this.showModal('添加歌曲到歌单', '输入歌曲名称搜索添加', (keyword) => {
                    this.searchAndAddToPlaylist(keyword, playlistId);

            // JSONP搜索歌曲 - 使用完整搜索接口获取更多结果
            searchSongs(keyword) {
                return new Promise((resolve, reject) => {

                    window[callbackName] = (data) => {

                        try {
                            if (data && data.data && data.data.song && data.data.song.list) {
                                const songs = data.data.song.list;
                                const processedSongs = songs.map((song) => {
                                    const albumMid = song.albummid || '';
                                    const coverUrl = albumMid ? `https://y.gtimg.cn/music/photo_new/T002R300x300M000${albumMid}.jpg` : null;
                                    const singers = Array.isArray(song.singer) ? song.singer.map(s => s.name).join(' / ') : '未知歌手';
                                    
                                    return {
                                        id: song.songmid || song.mid,
                                        name: song.songname || song.name,
                                        artist: singers,
                                        duration: song.interval ? this.formatTime(song.interval) : '未知',
                                        album: song.albumname || '未知专辑',
                                        songmid: song.songmid || song.mid,
                                        albummid: albumMid,
                                        coverUrl: coverUrl
                                    };
                                });
                                resolve(processedSongs);
                            } else {
                                resolve([]);
                            }
                        } catch (error) {
                            reject(error);
                        }
                    };
                    
                    const script = document.createElement('script');
                    script.src = `https://c.y.qq.com/soso/fcgi-bin/search_cp?w=${encodeURIComponent(keyword)}&p=1&n=20&cr=1&catZhida=1&format=jsonp&new_json=1&lossless=0&aggr=1&remoteplace=txt.yqq.song&g_tk=5381&jsonpCallback=${callbackName}&loginUin=0&hostUin=0&format=json&inCharset=utf8&outCharset=utf-8&notice=0&platform=yqq&needNewCode=0`;
                    
                    script.onerror = () => {
                        delete window[callbackName];
                        document.head.removeChild(script);

            // 播放歌曲

                    if (index < 0 || index >= presetSongs.length) return;
